body:
  text: 明萬曆二十九年一六一樂清知州胡氏刊本註是志刻本今存故宮圖書館其中漏頁三處茲以鈔本配補之鴈山志序璜川吳氏收藏圖書秀野草堂顧氏藏書印鴈山集一卷國初僧永昇編次詳畧無法猥雜偽作不足徵至是大夫蕩南朱公自吉郡歸老山中搜落選幽凢得殘碑缺簡賢儒父老之所傳述合如干簡勒成四卷號鴈山志以余謬當茲邑宜敘敘曰夫鴈山可不謂善勝已乎甌海東西巖谷泉洞島渚卉石臺𣛘殿廡耀乎嶄然何啻什百獨稱鴈蕩雁宕之生久矣其間投足而逰聚廬而處者何啻什百獨劉器之焦伯強王龜齡章大經數大君子一言一行具書在志其餘曾不得列姓焉若夫謝公之蠟屐寔未一至騷人顧唧唧好言靈運至于今不廢然則物所託扵不朽信自有足恃耶易有之天在山中大畜君子以多識前言往行以畜其德志者識也賢者識其大者言欲純事書欲純理其足以自畜如此志固宜不賢者竊識其瑰竒登眺之小而已葢前世嘗有㽞連茲土者忘其國恤而逐世娛百姓廢耕桑治𨕥牽馬奔走絕命其意猶以為未足民由是疾視厥山或相與目為尤物嗚呼此豈山之性哉初子朱子子張子偕逰南嶽酬唱終日動中倫慮猶乃凛然深惧喪志卒定約而去及康侯胡先生過衡愛其雄秀望而不登曰非職事所在晚居山下五年竟亦不出也夫張弛在時而不在物逰息以道而不以己樂山如是人豈有病之者哉詩云高山仰正景行行止雖不能至余心嚮往之峕嘉靖己亥秋八月之吉新安㯷溪潘潢序重修鴈山志敘樂邑在浙東南之濱其山脉自天台走海上至此則石骨嶙峋巃嵸嵂崒竒形怪態刻削天巧海內好樂之士爭慕之即不獲逰亦必索圖志以髣髴覩其山川之勝然每以刻久字刓不便觀覽為恨余治樂之二年適兵道唐公出示察院馬公鴈山紀勝詩三十韻命刊入志前且令考舊志仍加鋟明余遂求先續二志及近日詩文若干卷統皆翻刻以不負唐公之命而得縱目扵騷人詞客之所為大都誇詠其瑰崴絕特之状登眺臨觀之美亦云偁矣而新安樸溪潘公一序獨切切焉慮民疲於供命之艱先是置之末簡余竊謂古人之用心果好異乎昔齊景公欲為轉附朝儛之觀而晏子進以興發補不足范文正公記岳陽樓以直寫其江湖廊廟之憂盖士君子致君澤民之猷負之素定誠不以玩物遷也公之意其在斯歟其在斯歟公前樂清令也余去公逺不及盡得其當時治樂之所設施然傳者謂公誠心愛民靡事炫餙觀此益信不然昔今之令樂者凡幾而公民有專祀嵗時奔走不懈豈人力也哉因移其文弁於山志之首是役也博稽精校蔣生國輔林生有鳳與有勞焉得併書之峕萬曆辛巳秋八月之吉南昌胡汝寧識鴈山志目錄秀野草堂顧氏藏書印卷之一山名山界開山次第通山路徑谷湫峯泉池巖石洞潭溪澗峽門嶺障橋梁卷之二寺院十八刹建置沿革東外谷四寺庵堂亭附仙釋卷之三草木藥品附鳥獸鱗介附卷之四詩序記賦目錄終凢例羣賢詩文凢切扵鴈山者録膚淺浮泛者刪舊志兼録人物夫人物雖鍾光嶽而生然記載乃縣誌體故茲不録鴈山所産動植之物與他處同者不録但録其特異者羣公製作如王梅溪李五峯詩文入選者多盖二公詩文宗匠而東西外谷又其誕生之區景物飽諳故多録山志嘉靖間兩經修輯有前集續集繼此使軺往来製作甚夥寺廢僧亡稿半遺失今姑録其存者并為一集開山徑路彿刹沿革峯巒溪瀑皆仍其舊鴈山竒蹤跡靈跡難以指數茲因舊志缺畧者稍補之餘俟博洽君子詳焉凢例終逰雁蕩雜詩銅梁張佳胤顧印嗣立俠君老僧巖靣壁空山不記春獨留天眼閱風塵須彌四九黃金相化作頭陀百丈身石梁洞虹影高懸紫石梁洞門天放海霞光匡牀欲借和雲卧又報僊源道路長靈峰洞鐡壁千尋劈巨靈天門中斷列僊庭消搖自隔人間世朝暮雲封不用扃石芝峰十丈金莖秀可餐葳蕤雲擁一峯端啇顔滿地非難拾到此令人欲羽翰五老峰五老比肩立洞門五星上應天三垣斟酌北斗帝有命携爾同行朝至尊龍鼻水跨洞青龍睡未廻細聽鼻息欲成雷平吞玉筯寒生骨絕勝芙蓉露幾杯剪刀峰海霧粧成玉女裙天衣欲進紫霞君但憑刀尺操僊掌任爾青山細剪雲僊人橋飛梁矯首架層霄不數銀河烏鵲橋一曲白雲謠未畢忽聽風雨似相招天柱峰萬峯何地不雲煙一柱撑持帝象先我亦愚公君莫懼移来四柱上擎天獨秀峰舉目霞標自一峯峰頭雲起見孤松堪疑手植何人到定有天僊跨白龍響巖欲響群山在鼓琴宗生徒有卧逰心何如長嘯當空谷萬竅俱成鸞鳳音大龍湫雁蕩高翻百丈泉奔雷吹雪捲雲烟臨流朗誦青蓮句真是銀河落九天逰雁山畢晚飯能仁寺鎮日躭幽討鳴鐘飯化城蹊沿斤竹澗風送瀑泉聲古寺漸薪莽孤僧出柴荊山川憐謝客又作永嘉行登雁山最高處二首有跋攬轡東逰亦壯哉乗風謾躡此崔嵬天開雁蕩千峰出雲擁滄溟一鏡廻乳結懸厓凝若雪瀑飛削壁響成雷憑欄何恨蒼茫思搔首乾坤試舉杯捫蘿徙倚最高峰矯首雲霄似可從東指扶桑縈若木西瞻葱嶺削芙蓉洞中僊去還来鶴巖下雷鳴欲起龍寥廓恰期湖海願便將五嶽徧靈筇萬曆癸未春予廵行東甌因至茲山徧𠪱諸名勝山山絕竒神思勃勃飛動不能盡賦賦此嶺右張文熈書鴈宕雜咏大梁劉芳譽號際眀郡守前御史能仁寺楓露新澄野寺虛萬山飛鷲待停車老僧岩畔獨持缽玉女峰前疑借裾風激雙湫龍翥後月眀高沼鴈橫初普天形勝看將遍竒絕曾無此地如剪刀峰並起雙峰逈不群誤疑刀尺動宵分中㴠一線眀如練剪斷長天萬里雲大龍湫乍疑玉練瀉秋空非雨非烟萬壑風石壁夜深龍蛻去獨遺秋水作飛虹展旗峰秋老霜林萬木丹展旗不動暮雲寒群峰似列啣枚伍𤢜坐如登大將壇屏霞峰摩天峭壁俯禪關炫目丹砂好鑄顔恍惚仙源迷路處亂霞飛遶赤城山天柱峰孤峰一望與雲平萬仞支天類削成不鎻金莖霄漢裏露盤空向月華眀玉女峰窈窕胡然玉琢成恍疑眉黛逺山輕貞堅自許心難轉零露何妨宿夜行龍鼻水古洞隂森掛石龍翛然短壑駕長松鼻中點滴能消渴帝澤初開海上封卓筆峰亭亭丈石類霜毫勢入烟霄色並嬌可是江淹夢逰處墨蒼飛動片雲遙獨秀峰古石寒松逼太虛層隂長日蔽雲區無邊秀色真堪掬天際千峰縂不如僧抱石曇雲寳相自天開時擁優花傍草莱髣髴毘城齋罷後月眀持缽獨歸來水簾洞百道飛泉小洞幽水珠高綴狎烟浮開簾欲作山中觀一線垂天帶月鈎靈峰洞日月高懸古洞輝峕聞清梵欲皈依由来一宿通圎覺何待仙源七日歸五老峰曾聞九野聚星辰東井猶懸化石身遙憶大人峰縹緲相看俱是幻中真石梁洞山南山北霧濛濛誰向中天駕石虹莫問珠林何處是鐘聲原在有無中老僧巖石上袈裟事已真石頭長自厭風塵懸知一片西来意萬刼難灰不滅身鷹巖殊姿清絕化来真獨立蒼巖幾度春不逐玄雲摩碧漢肯同飛鳥觧依人㕠鸞峰青鸞㕠起近雲霄對舞雍雍神自饒鎮日乗風飛不去應知有意太平朝含珠峰縹緲雲中寳氣橫驪珠一粒價連城峰頭夜夜光如月何日飛還合浦眀托硯峯雨霽孤𡶶秋色寒高擎龍尾出雲端輕烟殘葉繽紛下疑灑壘蒼滿翠巒石門潭石門雲鎻倚天開積水千峰倒峡来怪道赤光潭現神魚昨夜化龍回逰雁山張德朙朝遊雁峰頂暮憇龍湫陽冥搜謝公跡苔封屐齒香剥蘇讀古碣席草飛羽觴窮眄象緯逼頫首江天長玄雲翳峭壁金鵝茁高岡摘来不敢食鵷鷺猶趋蹌逶迤下林樾思居恐太康何如含香使車馬日彭了相期躰憂樂眷念山民傷鴈山行符良佶號他山知縣黃岩人十載覊懷憶鴈山只今迢強躋扳出門正怯風光好始信山中嵗月閒為問山靈何乃爾巨靈辟出舊僊寰老僧當日空遺蛻玉女何年動咲顔丹鳳凌霄来日下蒼龍帶雨出雲間風淅淅日珊珊萬丈煙花下石𡊨展旗為我来方好卓筆憐予興未慳天柱忽驚高屹屹龍湫倦倚嚮潺潺休足力坐溪湾滿地烟霞任我飡怪石無名形自別竒峰萬状認尤艱多謝高僧頻指點丹青玅手畫應難多少幽竒看不盡欲將詩句寫松関囬首斜陽留不住馬蹄遙趂落霞還寄龍湫上人林宗元教諭號西崖樂清人乾坤萬古孕精華水窟山阿佛子家蕩雁送秋雲斷葉湫龍噓晝雨飛花老禪棲定金為錫騷客留題壁護紗有約西風絆雙屐逺從方外踏烟霞鴈蕩歌王士昌號斗溟給事台州人鴈山秀出滄海傍崩岩恠石凌蒼蒼雕鎪萬象出巨手造化精巧焉能蕆我来裹糧游十日賈勇芒鞋探竒入雲煙半濕青霞裾巖岫堪呼掌中出始涉清溪流白石何齒齒遙看紫翠中石門岩名相對峙瞿曇泛海来何年老僧岩袈裟負背叅青天東睇危梁跨絕壑石梁晴空百尺飛虹懸迤逶重陟謝公嶺灌木垂蘿白雲冷更從嶺上望靈峰寺名一朶青蓮披玉井將軍石將軍岩立如營門對舞雙鸞峰名躍紫氛照膽潭潭名澄奩鏡啟璚芝玉笋三峰名何繽紛石豁兩崖如合手百級丹梯懸洞口洞中𥦖窱日月開夏屋渠渠餘徑畆灵峯洞闘鷄巖頭日易西蹲虎石名疑從渡𢁺溪五老峯名排空對趺坐寳冠峯名高倚青冥低應接不知疲十里九涉澗晨發赤茅龍午炊白石飯靈岩寺右眾峰攢龍準漿垂沆瀣寒龍𮮰水天柱峰名撑雲扶四極屏霞障岩名日凌千盤誰閃朱旗搖北斗展旗峯寳光更見珠胎剖含珠峯如椽彤管若書空卓筆峯玉女峯名䨥鬟軃螓首天窗洞名暗穴不斷吹安禪谷谷名傍石屏峯名危軍持楊柳淨瓶峯洒天末碧霄大小二峯名雙呈竒一路連雲障峯名不絕大士觀音峯巖端吐初月淨明廢寺名重問講經臺斷碣遺碑半殘滅茆屋人家出近村綠蘿蒼菼炊烟昏馬鞍嶺限東西谷不信咫尺排天閽亂石怒流相歕薄金剪剪刀峯裁霞何岞崿龍湫大龍湫蜿蜒下雲根雷霆迸瀉眀河落峭壁周遭路欲窮時聞萬馬嘶天風氷簾玉柱清刺骨置身疑在鮫人宮常雲峰頭雲氣濕瑞鹿泉泉名邊泉水急言尋悟道賛皇祠還開山詎那室鴈湖絕頂不可攀搔首踟躇未忍還火焰山山名前餘古刹殿廊半沒蓁蕪間能仁寺山中相傳十八寺至今存者一二耳惟有諸峰秀不磨梵宇銷亡等閒事我来菅屫不敢停冥搜直欲窮山靈寧知造物忌多取嵐烟白晝昏冥冥吁嗟乎此山石多海水囓寰宇之中信竒絕何殊天上芙蓉城移来人世金銀闕斤竹澗澗名旁懷謝公當年蠟屐無留踪愧我已同圗上駿將無公好壁間龍自古名區多代謝豈為幽遐减聲價我今紀勝發長謠游人好省詩中畵秋日偕僚友㳺雁宕二首彭夢祖號生洲副使全椒人石門㕠嶹訝崔巍百一芙蓉面面開谷口霛峰如湧出洞中羅漢果飛来人尋鳥道青蓮㝢水落龍湫白日雷海內名山誰侶此平生幽賞最竒哉南戒峰高高插天石門秋色正蒼然香炉寳冠空中現龍鼻瓊漿洞裏懸古木吹風疑虎過野花連屋有僧眠鴈湖只在烟霄上父老猶傳沉塔年過四十九盤嶺宿能仁寺何士晋號武莪節推宜興人七七峰廽磴三三寺起鍾泉聲飛燕尾焰色點芙蓉籟入珠林靜香浮瑞靄濃曉来推戶看石壁幾雲封大龍湫懸崖玉練挂晴空噴雪飛珠幻莫窮自是蛟龍能變化啇霖只在此巖中剪刀峰百尺天孫雲錦囬全馮隻手此刀開只因𣣔補山龍衮不為霓裳輕剪裁天柱峰孤峰屹立矗雲根半壁東南賴汝存聞說深山多採使想應移取到天門展旗峰萬仞高懸大将壇旗開八面擁層巒指揮一任風雲捲未魅山妖膽自寒玉女峰春山為黛玉為肌一片貞心永不移莫怪露零沾夜草從来雲雨未曾知卓筆峰日煖霜毫自染丹雲烟掃盡墨花殘而今蒼蘚封彤管猶有龍蛇頴裏蟠鴈山観瀑八韻車大任現