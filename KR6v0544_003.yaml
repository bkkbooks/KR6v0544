body:
  text: 土産茶浙東多茶品而鴈山者稱最每春清明日採摘茶芽進貢一鎗一旗而白毛者名曰明茶榖雨日採者名曰雨茶此上品也其餘以粗細鬻賣取價宜以滾湯泡飲久熬則無清色香味一種紫茶葉紫色其味尤佳而香氣尤清難種而薄收土人厭人求索園圃中故少植間有亦必為識者取去杜鵑花有四種緋紅粉紅藍色碧色隨處有之惟鴈山書院左右最盛碧者亦難多見觀音竹莖小而葉細長不滿三四尺人家多植園圃中岩石上蒼翠經冬不凋方竹體小而方可作杖用山中人每取其枯瘦有稜節者刻其根為人物形充土宜以贈人筋竹質柔韌可作竹絲器皿用寺東南澗邊多有之澗因以名金星草葉上有金星點根中有黑筋如髮又謂之出髮草俗傳用以浸油塗頭上禿處則髮生金線草一名蟹殼草葉圓如蟹殼蔓生節間有紅線長尺許或生岩石上與井池邊性亦寒涼治燙火瘡用鳳尾草生巖石間葉如鳳尾性寒入痢藥用龍鬚草舊傳出自縉雲鼎湖軒轅黃帝升仙時乘龍而去羣臣拔龍鬚鬚墜化而為草晉時織為席嵗貢御座用今處處有之惟蘇州虎丘為盛種者如藝稻織席通四方溫州者次之産鴈山者莖細而秀石菖蒲深谷中有之亦有一寸而九節者但無服食之方耳緑草根有子如麥大白山名緑草米一名麥門冬性寒能治熱渴用櫻粟花紅實內有子如小粟皮苦澀能治泄痢症醫家謂之木榔捶百合性平根可食一名鬼蒜荒年山中人取以療飢鈎吻狀似黃精葉與莖稍有不同一則養人一則殺人其性毒烈與黃精逺甚服黃精者不可不察山中亦不多見黃精山多黃精土人鬻以代糧但不能知九蒸九曝之法耳此物雖處處有之惟以天台鴈蕩者為佳天台鴈蕩又以絶頂不聞雞犬之聲者為上品性中和薯蕷性寒有紅白二色産於岩石竹樹間者味清而甘堪入藥人圃種者味尤佳不堪入藥可入飲食用何首烏性平岩下石畔皆有之寺僧相傳惟靈岩寺佛殿下有一本甚大蔓延于外者絶與他蔓不類殿自洪武至今一百五六十年矣其根之大可如栲栳但為殿楹所壓無從而取之耳山蘿蔔性寒狀如圃中所種者土人用以治癰疽搗汁服之查塗患處愈可金叉石斛性寒生麥地中歲取入貢雪裏開性大寒深谷中有之能解砒毒冬時開花故名金線重樓性寒能治諸熱毒金銀花性涼能解熱毒土人用以作湯治諸瘡花初開時黃色後轉白色故名金銀花藤有汁而甘謂之啜蜜藤香薷性溫能治暑消煩止渴暖胃惟靈岩寺馬鞍嶺下石坦中産者佳人家園圃種者稍劣鳥獸白鷴形似雞而大白色毛有黑花細紋長尾生深谷溪澗中錦雞形似雞毛五色紋每日至午間胸前雜毛斑斕叢起宛如錦綬土人謂其吐錦過午則斂自矜其容每臨水自照或溺而死練鵲形似鵲而小尾長而色白金雀似雀而色黃與黃雀相類山樂官形似金雀羣鳴而聲相抑揚如作樂音土人謂之山樂官山羊其狀如鹿而能歷險白者如雪猿有毛如狨謂之金線熊形似人而長大山中人呼為野人有力能拔樹又名為人熊惟鴈山西北趾深林中有之於巨木駢立處連結其枝構為一巢夜則棲宿于上晝則下林中取食遇人則避入叢莽中玉面狸形似貓面有白毛霜後肉美山中人以為佳品諺云霜天玉面狸竹豚狀似小豬兒又如巨鼠竹林中有之食笋根味清美獾豬似豬而小肉肥美野豬似豬而大大者重二三百斤健嘴長牙有力能與虎鬪田狗形似狗而小毛深溫厚可作暖耳用香狸形似貓肉香美五𫨻狸尾有黑白紋相間各五𫨻肉肥美猴十百為羣巢於高崖石洞中秋時樟樹子熟則相率摘食居人出其不意嗾犬以嚇之驚墜茅中不能跳躍或為人所獲魚類香魚一名細鱗魚無腥而鱗極細肉甚美生鴈山溪澗中與潮水相通處春初時生月長一寸九月以後可盈一尺則赴潮際生子生已則黑瘠而死於鹹水中次年春初子復化為魚苗仍入淡水中隨月而長五月以後可長五寸漁者始取以鬻諸人味極清美作乾魚尤佳凡山水入江處皆有之在樂清則石門潭為盛筋竹溪芙蓉溪次之蕩水西流於永嘉南溪則自楓林當溪下渡潭石廟潭諸處亦有之均産於蕩水之一源也石門鯉魚門內巨潭多鯉魚味甘而清美異於他所産者每天晴日初出時羣浮水上可一二畞許中有一巨鯉其長如人衆魚環繞隨而旋轉若相侍然漁者百計終莫能得或以為神魚云
