body:
  text: 山名鴈山一名鴈蕩宕同一名平湖一名鴈湖去縣東鄉九十里高四十里頂上有湖方可十里水常不涸春鴈歸時多宿于此故名或曰山勢最高上有水蕩惟鴈宿焉山界北至蒼山在永嘉縣南溪寒坑外二十里即蒼坡山也東至溫嶺一名溫嶠其地常暖冬月不寒舊為溫之南界溫州所以得名也原屬樂清今分隸台之太平縣西至白巖在東外谷北閣蕩隂今有白巖寺南至玉環山在海中開山次第舊志晉謝靈運為永嘉守好逰山水自郡城渡江上䈥竹澗有渡䈥竹澗詩澗今在能仁寺東南山峽中龍湫諸水所會入海處去海十餘里寺西北有謝公嶺相傳是靈運䗶屐所經處也又按西域書諾詎那者即諾詎羅天竺第五羅漢居震旦大海際讃曰每一羅漢西域書內有一讃大略言其出處道場事鴈蕩經行雲漠漠龍湫宴坐雨濛濛今龍湫諾詎那菴其宴坐處也俗傳諾詎那觀瀑坐化于此云宋太平興國元年永嘉僧全了逰方至荊州天竺遇一神僧謂之曰汝緣在浙東當得名山居之永嘉有諾詎那者道場適當興師宜往訪力成茲事了詰其所曰地以花名山以鳥名中有龍湫宴坐此尊者棲息地也二年歸而遍訪諸山不遇行至海濱見山水清奧因問其名父老曰芙蓉村鴈蕩山也了大感悟遂往山中結菴于要會處曰芙蓉菴即今能仁寺至天聖元年有僧文吉居山之東碧霄峰下曰碧霄菴即今靈峰寺開山靈跡始著諸寺相繼而興通山徑路舊志右路自邑而往道白沙芳林逾窰嶴過長原徑古塔本覺寶冠石門諸寺出白溪驛即今嶺店驛而往台之黃巖自黃巖來由白若嶺入石梁過靈巖寺逾馬鞍嶺至能仁出長抵窰嶴驛至縣一路由䈥竹澗入沿澗皆小徑抵能仁過馬鞍嶺至靈巖靈運自永嘉渡江至海涯登岸循澗路入山度今之謝公嶺嶺在馬鞍嶺北入南北閣抵黃巖永嘉界路自邑之窰奧逾嶺至小芙蓉上丹芳嶺即四十九盤嶺抵能仁寺寺在嶺下逾馬鞍嶺至靈巖出白溪至嶺店驛似為捷徑比舊路約省二十里又一小徑二處一從南北閣來者自謝公始一從江邊龍平來者自陌西始陌西在驛路白峯嶺邊當窰奧嶺店二驛折中處又一徑從䈥竹上飛泉寺入能仁寺其徑路崎嶇難行谷以馬鞍嶺為界分東西谷嶺東有內谷外谷嶺西亦有內谷外谷計四谷入山之路自西始西外谷寺五古塔靈雲寶冠石門本覺西內谷寺七能仁羅漢飛泉普明天柱華嚴瑞鹿東外谷寺二石梁雙峯東內谷寺四靈岩淨名靈峯真濟水簾谷水自岩下散垂如簾廬山康王谷亦有水簾彼之循崖而下不如此之飛墜而飄散可觀也安禪谷在靈岩寺後石壁下中虛如室而外坦平開山僧神朗所居會賢谷在靈岩寺後以上俱東內谷南閣谷在鴈山北支北閣谷在南閣溪北二閣以溪分南北俱在東谷外湫大龍湫一名大瀑布在西谷能仁寺五里許水自鴈湖合諸溪澗會成巨淵淵側石檻有龍窟如井狀深黑不可測檻中作凹石壁數百仞水從凹中瀉下望之若懸布隨風作態逺近斜正變幻不一或如散珠如驟雨如飛麵如濛濛烟霧或飄轉而中斷或左右分散而落或直下如注或屈轉如蜿蜓觀者每立於潭外相去數十步水忽轉舞向人亂灑衣帽皆沾濕忽大注如轟雷或為風所遏盤桓而不下皆奇態也廬山瀑布惟沿崖下溜無變態似不及此彼聞天下者路出要區耳小龍湫一名小瀑布在東谷靈岩寺後水自石城諸溪澗來會于霞障右脅從巖溜中飛流而下高數百丈山間好事者嘗準之云大龍湫高五千尺小龍湫高三千尺而小龍湫之水惟直瀉下其半沿崖不能如大龍湫之飛舞作態是為大小之別也上龍湫一名上瀑布在大龍湫上數里自來人跡罕到無有知者近嵗五臺二僧曰白雲雲外者結屋往居大龍湫上於湫畔平土中種薑芋菜蔔自給嘗散步至湫下云與下大龍湫相似飛流懸瀉亦數百丈地僻而人跡罕到故鮮有知者峯東谷諸峯雙鸞寶印嶤闕小卓筆獨秀重樓茶爐石指天柱展旗招賢獅子伏龜礪齒石碑天冠總角一名童子金鼎蓮花迎陽石燕下有小石屏碧霄一名逍遙嶠形如轎凌雲朝天五雲雙冗下有連雲障槖駝戲獅犀角香爐倚天一名獨秀鳳凰超雲丹桂象牙玉蟾蜍芝草虎蹲龜子藥杵架海朝陽西谷辦有朝陽佛掌鼓槌覆船捲螺鉢盂三賢以上四十八峯俱東內谷石佛獅子雙峯老人峯吹簫志無見梅溪集以上五峯俱東外谷西谷諸峯紫極棲鳳華陽戴辰戲龍群鳳回鸞石龜朝陽瓊臺石笋卧龍凌霞瑞鹿抱兒獅子石碑一名紫薇屏立笋削玉卓筆天樂宴坐常雲剪刀以上二十四峯俱西內谷連珠靈犀獅子山冠石表立戟羽人射垛含珠含翠朝陽靈芝二仙招賢寶冠寶簮石鏡鳳凰香爐伏虎天冠獅子西內谷東谷各有獅子峯五雲雙冗以上二十四峯俱西外谷泉龍鼻泉一名龍鼻水在東谷靈岩寺後大石龕內從寺後上石磴盤數十折至龕口口高數十丈深十餘丈皆石壁龕脊石色皆紫黑色中嵌橫石作鱗甲狀陷入石中從下視之獨見其脊隆然外露宛若龍形繞下數十丈勢盡乃垂入龕底作懸鼻如小瓠壺而稍長石色紺碧而膩滑鼻端有小孔出泉水時時一下滴僧人以小盂盛之云洗眼可以祛翳疾客至此皆脅息吻燥取以潤渴則清寒不可著齒雖暑月如飲冰客或坐龕下小酌歌笑絃管之聲繞壁間不即出悠揚石罅最為可聽劒鋒泉在小龍湫下稍西湧出石罅直上指二尺許形如立劒自逺望之則光明瑩潔而搖動觀者駭愕莫知其端意者湫水下搗于潭中勢甚急迸出石罅故直上也石罅有小稜故作劒形凡水自高而來者躍處必高濟南跑突泉亦出地數尺相傳是黑虎泉自高原潛行地中至此而突出亦此類也摩訶泉在東谷摩訶者梵語也相傳天久旱僧人作呪以祈水卓錫於此泉即湧出故名合掌泉在東谷出石間形如合掌泉發掌中溫湯泉在靈岩寺後霞障右脅懸崖石室中室中有窪窪中有泉冬暖如湯寺僧相傳昔有羅漢常浴於此至今石路上有平偃跡石室乃其愒息地也按浙下無溫泉惟此有之惜乎産於幽谷深崖而人跡罕到也巖梅雨巖在西外谷岩上有水飛灑而下濛濛然常若梅雨天柱巖在西外谷狀如天柱峯頂平而大蓋鋭而秀者曰峯平而大者曰岩也白雨岩火熖岩童子誦經岩狀如童子常聞有誦經聲文英岩寶陀岩寶香岩以上五岩俱在西谷觀音岩槖籥岩注金岩石相岩楞嚴岩神跡岩文會岩霹靂岩棲真岩神王岩石臍岩修道岩赤石岩侍郎岩宋胡侍郎讀書所騰波岩巾子岩響岩狀圓孤立溪中行人語其側則隨聲相應說法岩陳覺說法處聽泉岩以上十八岩俱在東谷散水岩隱山岩石佛岩仙岩讀書岩章恭毅公讀書所方岩在鴈山東趾溫嶺內二謝先生所居以上六岩俱在東外谷石招賢石大梁石石鏡石天窗石塜以上五石俱西外谷虎蹲石覆盂石鴟尾石圓羅石石門柱二石對立如柱石城石茶爐以上七石俱在西谷僧抱石一名僧寶石含珠石龍潭石飲羽石獼猴石觀音石在龍鼻水下元時有一監司持去渡江逢惡浪投諸水後復得於故處詳紀異石廡石明堂石屏風石魚石倉石斛石橋大小石屏風石碁枰石浮屠石室中空底平如室可居石居士小石屏以上十九石俱在東谷石梁石行廊鴈山西趾公洞石廊尤為勝絶以上二石俱東外谷潭下培潭在䈥竹澗深廣幽邃傍有龍王廟祈雨有驗西龍潭鴈山龍潭數處惟此潭祈禱每應水亦奇秀大龍湫潭在大瀑布下巖石間瀑水直瀉入潭潭水常沸潭邊有慈濟廟旱時祈雨多有驗僧官詮上人嘗言其靈異跡事見紀異小龍湫潭在小瀑布下潭傍多怪石水跳躍出石間奇態有過於大龍湫者以上四潭俱西谷照膽潭在靈峯寺外廣數十畞水自巨岩亂石出滙成深淵絶清可見底梅雨潭在靈峯寺側瀑水自崖飛瀉下每風起水吹著人常濛濛如四五月梅雨然白雨潭在靈峯寺側以上三潭俱在東谷池騰池在東谷其水騰躍而上出洞天聰洞在東谷靈岩寺後大石壁間壁有巨冗望之若人之耳竅然故名龍逰洞在東谷舊傳龍過處而成此洞古云龍不見石理或有之石洞在東外谷舊縣志云洞在山腰天隂聞有雞犬聲新月洞在東谷狀如初月故名羅漢洞在東谷靈峯寺後幽深秀絶中如廣厦傍有石室皆可居僧不設屋就洞卧起冬溫而夏涼內塑應真像五百身相傳過客至誠瀹茗則往往成乳花見紀異古洞一名烏洞在東谷馬鞍嶺下小谷中空敞可畞許水自項上石縫中飛灑而下洞中水深三四尺産小魚如鰍不堪食土人呼為水和尚水從洞門出灌稻畦數頃居人恆厭夫逰者詒之從他徑去故人亦鮮知之者風洞一在大龍湫右側連雲障絶壁上每大風將作則洞口木葉飛舞轉急居人候之則明日大風作矣一在照膽潭上路側石崖中洞口大如斗有風自口中出附口處草皆外偃牧牛小兒常羣集于崖下以手向洞云夏可取凉冬可取溫也豫適冬月過洞下令人試之皆言近手處若向火蓋陽氣自地而發土冗中皆能通泄夏之涼者隂氣也南碧霄洞在靈峯寺後深邃而清幽多奇石北碧霄洞與南碧霄洞相對中隔溪水亦多奇石道松洞在瑞鹿寺後深廣可容數百人是住僧道松所開道姑洞即陶公洞世傳陶弘景修煉於此乃陶公洞也方言訛而為道姑耳洞在鴈山西北趾去山六十餘里在永嘉界上鴈蕩多石山而洞乃純石也洞外有巨石長可數十丈平坦如牀側立者如屏風內有石室二重宛如堂房其路平熟常若有人來往者洞外巨木數百株有熊棲其上石佛洞在南閣山中洞口四石相倚水自石出路可側行宛若二門石梁橫跨澗上緣梯而上躋禮佛壇西北岩龕三石佛巋然蒼莽間若相次而行相肩而語者不知高幾百仞也壇上一小石碑題曰邑令葛逢率僧法成義超同瞻石佛熙寧乙卯仲夏晦日刻溪新溪在鴈山北蕩水北出為新溪東流會于寒坑板藏大溪南入于海袁采記寒坑龍潭最為奇勝水自蕩頂流下經寒坑南注蒼山之坡從楓林當溪石柱古廟潮際以入甌江寒坑以下皆名南溪以蕩水南流得名也俱永嘉地䈥竹溪在䈥竹澗下水從大龍湫出經龍平塘入海白溪在鴈山東白若嶺下水自靈峯諸谷中出東流入于海舊有白溪驛今遷于嶺北大荊曰嶺店驛相去十餘里九折溪一名石溪在鴈山北閣水從鴈山東北諸谷中出東行十餘里與大龍灘合流東會于石門入海澗䈥竹澗在能仁寺東南山峽中水從大龍湫下靈運渡江逰鴈山初從此澗入有渡䈥竹澗詩見文詞峽經行峽在能仁寺東南五里近水自大龍湫來出䈥竹澗入海唐僧貫休為諾詎那贊云鴈蕩經行雲漠漠龍湫宴坐雨濛濛後人因以名峽門石門在鴈山東北蕩隂諸谷水所會也兩崖屹立望之如門水從門中出大小計一十八水門內外俱成巨淵水漲時深可二十丈門側水底石中有龍井仰口如圓甑居人嘗見夜間有赤光馬相傳原是一山元至正間山水瀑出有龍自鴈山乘水而下觸山斷為兩崖而中空若門按梅溪集梅溪先生下第時嘗過石門有詩記水勢之危險宋前雖無所考靈運集中亦有石門詩一首疑即此石門也若然則由來逺矣至正間水發而龍觸者好事者為之也大抵山川開闢之初人莫得而測焉康樂梅溪詩俱見文詞下嶼卓嶼馬家嶼俱南閣水口蕩隂諸水皆經於此而下石門二嶼參差對立狀如卓筆尖秀圓直而鬱然章恭毅公第在上游約里許自台入鴈者遙遙望二嶼宛若大華表然古人謂是鴈山之北戶又為鴈山之眉目云自今諦視之誠猶室之有門戶人之有眉目也閣南閣北閣俱在蕩隂高原外有環抱中土寬平可居之地也蕩水自西北而來界於中流南曰南閣北曰北閣土壤饒沃人物繁衍恭毅公第在南閣底嶺東嶺在鴈山西南入西內谷至能仁寺東北出驛路丹芳嶺一名四十九盤在能仁寺西入西內谷寺在嶺下嶺路盤轉四十九折山極陟峻故羊腸其狀也飛泉嶺在能仁寺東南通䈥竹澗路上飛泉寺謝公嶺在靈岩寺東通石梁寺入南北閣又出驛路相傳靈運逰鴈山時䗶屐過此故名馬鞍嶺一名石城嶺在能仁寺東北五里許逾嶺至靈岩寺嶺背石凹狀如馬鞍故名溫嶺一名溫嶠在東外谷鴈山東趾也去能仁寺四十餘里其地常溫溫州所以得名舊屬樂清今分隸台之太平按鴈山舊志云東至玉環山山在嶺南大海中則溫嶺又是鴈山至內之地也西嶺在能仁寺西由羊瑞坑度嶺出長障屏霞障在靈岩寺後高廣數百丈石色如塗丹堊龍鼻水安禪谷在其下溫泉石室在其上連雲障在西谷瀑布左右連亘里許左半崖有雙穴如人鼻孔謂之閻王鼻右半崖有風洞呼嘯則風至橋行春橋在能仁寺前西谷諸水由橋下出䈥竹澗入于海星橋在淨明寺前傍視橋下空明如星極其精固至今略無震動俗傳昔僧富鎔銅鐡作而成者
