body:
  text: 明萬曆二十九年一六一樂清知州胡氏刊本注是志刻本今存故宮圖書館其中漏頁三處茲以鈔本配補之鴈山志序璜川吳氏收藏圖書秀野草堂顧氏藏書印鴈山集一卷國初僧永升編次詳略無法猥雜偽作不足徵至是大夫蕩南朱公自吉郡歸老山中搜落選幽凡得殘碑缺簡賢儒父老之所傳述合如干簡勒成四卷號鴈山志以余謬當茲邑宜敘敘曰夫鴈山可不謂善勝已乎甌海東西巖谷泉洞島渚卉石臺榭殿廡耀乎嶄然何啻什百獨稱鴈蕩雁宕之生久矣其間投足而逰聚廬而處者何啻什百獨劉器之焦伯強王龜齡章大經數大君子一言一行具書在志其餘曾不得列姓焉若夫謝公之蠟屐實未一至騷人顧唧唧好言靈運至于今不廢然則物所託于不朽信自有足恃耶易有之天在山中大畜君子以多識前言往行以畜其德志者識也賢者識其大者言欲純事書欲純理其足以自畜如此志固宜不賢者竊識其瑰竒登眺之小而已蓋前世嘗有留連茲土者忘其國恤而逐世娛百姓廢耕桑治道牽馬奔走絶命其意猶以為未足民由是疾視厥山或相與目為尤物嗚呼此豈山之性哉初子朱子子張子偕逰南嶽酬唱終日動中倫慮猶乃凛然深懼喪志卒定約而去及康侯胡先生過衡愛其雄秀望而不登曰非職事所在晚居山下五年竟亦不出也夫張弛在時而不在物逰息以道而不以己樂山如是人豈有病之者哉詩云高山仰正景行行止雖不能至余心嚮往之峕嘉靖己亥秋八月之吉新安㯷溪潘潢序重修鴈山志敘樂邑在浙東南之濱其山脈自天台走海上至此則石骨嶙峋巃嵸嵂崒竒形怪態刻削天巧海內好樂之士爭慕之即不獲逰亦必索圖志以髣佛覩其山川之勝然每以刻久字刓不便觀覽為恨余治樂之二年適兵道唐公出示察院馬公鴈山紀勝詩三十韻命刊入志前且令考舊志仍加鋟明余遂求先續二志及近日詩文若干卷統皆翻刻以不負唐公之命而得縱目于騷人詞客之所為大都誇詠其瑰崴絶特之狀登眺臨觀之美亦云稱矣而新安朴溪潘公一序獨切切焉慮民疲於供命之艱先是置之末簡余竊謂古人之用心果好異乎昔齊景公欲為轉附朝儛之觀而晏子進以興發補不足范文正公記嶽陽樓以直寫其江湖廊廟之憂蓋士君子致君澤民之猷負之素定誠不以玩物遷也公之意其在斯歟其在斯歟公前樂清令也余去公逺不及盡得其當時治樂之所設施然傳者謂公誠心愛民靡事炫飾觀此益信不然昔今之令樂者凡幾而公民有專祀嵗時奔走不懈豈人力也哉因移其文辨於山志之首是役也博稽精校蔣生國輔林生有鳳與有勞焉得併書之峕萬曆辛巳秋八月之吉南昌胡汝寧識鴈山志目録秀野草堂顧氏藏書印卷之一山名山界開山次第通山路徑谷湫峯泉池巖石洞潭溪澗峽門嶺障橋梁卷之二寺院十八剎建置沿革東外谷四寺庵堂亭附仙釋卷之三草木藥品附鳥獸鱗介附卷之四詩序記賦目録終凡例羣賢詩文凡切于鴈山者録膚淺浮泛者刪舊志兼録人物夫人物雖鍾光嶽而生然記載乃縣志體故茲不録鴈山所産動植之物與他處同者不録但録其特異者羣公製作如王梅溪李五峯詩文入選者多蓋二公詩文宗匠而東西外谷又其誕生之區景物飽諳故多録山志嘉靖間兩經修輯有前集續集繼此使軺往來製作甚夥寺廢僧亡稿半遺失今姑録其存者并為一集開山徑路佛剎沿革峯巒溪瀑皆仍其舊鴈山竒蹤迹靈迹難以指數茲因舊志缺略者稍補之餘俟博洽君子詳焉凡例終逰雁蕩雜詩銅梁張佳胤顧印嗣立俠君老僧巖靣壁空山不記春獨留天眼閲風塵須彌四九黃金相化作頭陀百丈身石梁洞虹影高懸紫石梁洞門天放海霞光匡牀欲借和雲卧又報仙源道路長靈峰洞鐡壁千尋劈巨靈天門中斷列仙庭消搖自隔人間世朝暮雲封不用扃石芝峰十丈金莖秀可餐葳蕤雲擁一峯端啇顔滿地非難拾到此令人欲羽翰五老峰五老比肩立洞門五星上應天三垣斟酌北斗帝有命携爾同行朝至尊龍鼻水跨洞青龍睡未回細聽鼻息欲成雷平吞玉筯寒生骨絶勝芙蓉露幾杯剪刀峰海霧粧成玉女裙天衣欲進紫霞君但憑刀尺操仙掌任爾青山細剪雲仙人橋飛梁矯首架層霄不數銀河烏鵲橋一曲白雲謠未畢忽聽風雨似相招天柱峰萬峯何地不雲煙一柱撑持帝象先我亦愚公君莫懼移來四柱上擎天獨秀峰舉目霞標自一峯峰頭雲起見孤松堪疑手植何人到定有天仙跨白龍響巖欲響群山在鼓琴宗生徒有卧逰心何如長嘯當空谷萬竅俱成鸞鳳音大龍湫雁蕩高翻百丈泉奔雷吹雪捲雲煙臨流朗誦青蓮句真是銀河落九天逰雁山畢晚飯能仁寺鎮日耽幽討鳴鐘飯化城蹊沿斤竹澗風送瀑泉聲古寺漸薪莽孤僧出柴荊山川憐謝客又作永嘉行登雁山最高處二首有跋攬轡東逰亦壯哉乘風謾躡此崔嵬天開雁蕩千峰出雲擁滄溟一鏡回乳結懸崖凝若雪瀑飛削壁響成雷憑欄何恨蒼茫思搔首乾坤試舉杯捫蘿徙倚最高峰矯首雲霄似可從東指扶桑縈若木西瞻蔥嶺削芙蓉洞中仙去還來鶴巖下雷鳴欲起龍寥廓恰期湖海願便將五嶽遍靈筇萬曆癸未春豫巡行東甌因至茲山遍歷諸名勝山山絶竒神思勃勃飛動不能盡賦賦此嶺右張文熙書鴈宕雜咏大梁劉芳譽號際眀郡守前御史能仁寺楓露新澄野寺虛萬山飛鷲待停車老僧岩畔獨持鉢玉女峰前疑借裾風激雙湫龍翥後月眀高沼鴈橫初普天形勝看將遍竒絶曾無此地如剪刀峰並起雙峰逈不群誤疑刀尺動宵分中㴠一線眀如練剪斷長天萬里雲大龍湫乍疑玉練瀉秋空非雨非煙萬壑風石壁夜深龍蛻去獨遺秋水作飛虹展旗峰秋老霜林萬木丹展旗不動暮雲寒群峰似列銜枚伍獨坐如登大將壇屏霞峰摩天峭壁俯禪關炫目丹砂好鑄顔恍惚仙源迷路處亂霞飛繞赤城山天柱峰孤峰一望與雲平萬仞支天類削成不鎖金莖霄漢裏露盤空向月華眀玉女峰窈窕胡然玉琢成恍疑眉黛逺山輕貞堅自許心難轉零露何妨宿夜行龍鼻水古洞隂森挂石龍翛然短壑駕長松鼻中點滴能消渴帝澤初開海上封卓筆峰亭亭丈石類霜毫勢入煙霄色並嬌可是江淹夢逰處墨蒼飛動片雲遙獨秀峰古石寒松逼太虛層隂長日蔽雲區無邊秀色真堪掬天際千峰總不如僧抱石曇雲寶相自天開時擁優花傍草萊髣佛毗城齋罷後月眀持鉢獨歸來水簾洞百道飛泉小洞幽水珠高綴狎煙浮開簾欲作山中觀一線垂天帶月鈎靈峰洞日月高懸古洞輝峕聞清梵欲皈依由來一宿通圎覺何待仙源七日歸五老峰曾聞九野聚星辰東井猶懸化石身遙憶大人峰縹眇相看俱是幻中真石梁洞山南山北霧濛濛誰向中天駕石虹莫問珠林何處是鐘聲原在有無中老僧巖石上袈裟事已真石頭長自厭風塵懸知一片西來意萬劫難灰不滅身鷹巖殊姿清絶化來真獨立蒼巖幾度春不逐玄雲摩碧漢肯同飛鳥解依人雙鸞峰青鸞雙起近雲霄對舞雍雍神自饒鎮日乘風飛不去應知有意太平朝含珠峰縹眇雲中寶氣橫驪珠一粒價連城峰頭夜夜光如月何日飛還合浦眀托硯峯雨霽孤𡶶秋色寒高擎龍尾出雲端輕煙殘葉繽紛下疑灑壘蒼滿翠巒石門潭石門雲鎖倚天開積水千峰倒峽來怪道赤光潭現神魚昨夜化龍回逰雁山張德明朝遊雁峰頂暮憩龍湫陽冥搜謝公迹苔封屐齒香剝蘇讀古碣席草飛羽觴窮眄象緯逼俯首江天長玄雲翳峭壁金鵝茁高岡摘來不敢食鵷鷺猶趨蹌逶迤下林樾思居恐太康何如含香使車馬日彭了相期躰憂樂眷念山民傷鴈山行符良佶號他山知縣黃岩人十載羈懷憶鴈山只今迢強躋扳出門正怯風光好始信山中嵗月間為問山靈何乃爾巨靈辟出舊仙寰老僧當日空遺蛻玉女何年動笑顔丹鳳凌霄來日下蒼龍帶雨出雲間風淅淅日珊珊萬丈煙花下石𡊨展旗為我來方好卓筆憐豫興未慳天柱忽驚高屹屹龍湫倦倚嚮潺潺休足力坐溪灣滿地煙霞任我餐怪石無名形自別竒峰萬狀認尤艱多謝高僧頻指點丹青妙手畫應難多少幽竒看不盡欲將詩句寫松關回首斜陽留不住馬蹄遙趂落霞還寄龍湫上人林宗元教諭號西崖樂清人乾坤萬古孕精華水窟山阿佛子家蕩雁送秋雲斷葉湫龍噓晝雨飛花老禪棲定金為錫騷客留題壁護紗有約西風絆雙屐逺從方外踏煙霞鴈蕩歌王士昌號斗溟給事台州人鴈山秀出滄海傍崩岩怪石凌蒼蒼雕鎪萬象出巨手造化精巧焉能蕆我來裹糧遊十日賈勇芒鞋探竒入雲煙半濕青霞裾巖岫堪呼掌中出始涉清溪流白石何齒齒遙看紫翠中石門岩名相對峙瞿曇泛海來何年老僧岩袈裟負背參青天東睇危梁跨絶壑石梁晴空百尺飛虹懸迤逶重陟謝公嶺灌木垂蘿白雲冷更從嶺上望靈峰寺名一朵青蓮披玉井將軍石將軍岩立如營門對舞雙鸞峰名躍紫氛照膽潭潭名澄奩鏡啓璚芝玉笋三峰名何繽紛石豁兩崖如合手百級丹梯懸洞口洞中𥦖窱日月開夏屋渠渠餘徑畝靈峯洞鬪雞巖頭日易西蹲虎石名疑從渡虎溪五老峯名排空對趺坐寶冠峯名高倚青冥低應接不知疲十里九涉澗晨發赤茅龍午炊白石飯靈岩寺右衆峰攢龍準漿垂沆瀣寒龍𮮰水天柱峰名撑雲扶四極屏霞障岩名日凌千盤誰閃朱旗搖北斗展旗峯寶光更見珠胎剖含珠峯如椽彤管若書空卓筆峯玉女峯名䨥鬟軃螓首天窗洞名暗穴不斷吹安禪谷谷名傍石屏峯名危軍持楊柳淨瓶峯灑天末碧霄大小二峯名雙呈竒一路連雲障峯名不絶大士觀音峯巖端吐初月淨明廢寺名重問講經臺斷碣遺碑半殘滅茆屋人家出近村緑蘿蒼菼炊煙昏馬鞍嶺限東西谷不信咫尺排天閽亂石怒流相噴薄金剪剪刀峯裁霞何岞崿龍湫大龍湫蜿蜒下雲根雷霆迸瀉眀河落峭壁周遭路欲窮時聞萬馬嘶天風氷簾玉柱清刺骨置身疑在鮫人宮常雲峰頭雲氣濕瑞鹿泉泉名邊泉水急言尋悟道贊皇祠還開山詎那室鴈湖絶頂不可攀搔首踟躇未忍還火焰山山名前餘古剎殿廊半沒蓁蕪間能仁寺山中相傳十八寺至今存者一二耳惟有諸峰秀不磨梵宇銷亡等間事我來菅屫不敢停冥搜直欲窮山靈寧知造物忌多取嵐煙白晝昏冥冥吁嗟乎此山石多海水囓寰宇之中信竒絶何殊天上芙蓉城移來人世金銀闕斤竹澗澗名旁懷謝公當年蠟屐無留蹤愧我已同圗上駿將無公好壁間龍自古名區多代謝豈為幽遐減聲價我今紀勝發長謠遊人好省詩中畫秋日偕僚友遊雁宕二首彭夢祖號生洲副使全椒人石門雙嶹訝崔巍百一芙蓉面面開谷口霛峰如湧出洞中羅漢果飛來人尋鳥道青蓮宇水落龍湫白日雷海內名山誰侶此平生幽賞最竒哉南戒峰高高插天石門秋色正蒼然香爐寶冠空中現龍鼻瓊漿洞裏懸古木吹風疑虎過野花連屋有僧眠鴈湖只在煙霄上父老猶傳沉塔年過四十九盤嶺宿能仁寺何士晉號武莪節推宜興人七七峰廽磴三三寺起鍾泉聲飛燕尾焰色點芙蓉籟入珠林靜香浮瑞靄濃曉來推戶看石壁幾雲封大龍湫懸崖玉練挂晴空噴雪飛珠幻莫窮自是蛟龍能變化啇霖只在此巖中剪刀峰百尺天孫雲錦回全馮隻手此刀開只因𣣔補山龍衮不為霓裳輕剪裁天柱峰孤峰屹立矗雲根半壁東南賴汝存聞説深山多採使想應移取到天門展旗峰萬仞高懸大將壇旗開八面擁層巒指揮一任風雲捲未魅山妖膽自寒玉女峰春山為黛玉為肌一片貞心永不移莫怪露零沾夜草從來雲雨未曾知卓筆峰日暖霜毫自染丹雲煙掃盡墨花殘而今蒼蘚封彤管猶有龍蛇頴裏蟠鴈山觀瀑八韻車大任現