body:
  text: 寺院十八剎建置沿革鴈山寺宇凡十有八鐘梵之音聞千百里贍僧之田贏於萬丈及其衰也僧稀寺廢断礎遺墟凄然於烟草之中遊人亦罕至矣訊之於僧興廢以三百年為一輪廻云能仁寺在西內谷丹芳嶺下即四十九盤嶺相傳諾詎那為開山祖按西域書第五位尊者諾詎那大阿羅漢續居震旦南大海際鴈蕩山又云龍湫雁蕩乃吾佛弟子諾詎那尊者之化都也詎那至山中觀瀑遂坐化焉宋太平興國元年丙子僧全了入山結菴而居名芙蓉菴詳開山下至咸平二年始建殿宇四年寺僧進百宝塔賜名承天寺政和七年以禁中有承天寺改能仁寺紹興十二年郡守閭丘昕奏改能仁禪院遂為鴈山大道場後皇舅太寧郡王請寺為奉先地詔賜額曰時思薦福寺至乾道七年以太上皇后命復為能仁寺元至正丙午遭兵燹國朝洪武二十四年立成叢林至三十一年僧曇竺修建殿宇後圮萬曆六年督撫常熟徐公栻重建靈岩寺在東內谷太平興國四年僧行亮神昭即神朗挈瓶荷錫共訪幽竒得鴈山安禪谷居焉新市蔣光賛為建殿宇寺之山水靈秀名聞京師太宗命中貴人持御書五十二卷軸賜於寺咸平十二年賜額靈岩禪寺天聖十年仁宗賜藏經凡千卷皆金字元至正間遭兵燹經書亦無存者至國朝洪武八年僧道沛重建二十四年歸併成叢林後圮督撫徐公栻重建靈雲寺在西外谷宋太平興國五年建熙寧元年賜額國朝洪武二十四年歸併成叢林雙峯寺在東外谷宋祥符元年僧法逺建後有禪僧善持誦每誦經于峯下有老人侍聽忽不見世傳以為寒坑神龍来聽法也詳紀異靈峯寺在東內谷宋天聖元年僧文吉建康定二年賜額寺傍泉石奇恠亞於靈岩而羅漢洞尤為勝絕寳冠寺在西外谷宋咸平四年僧全了建熙寧元年賜額後廢元末重建復廢國朝洪武二十四年歸併靈雲寺今廢羅漢寺在西內谷宋咸平二年僧全了建熙寧元年賜額後被寇燬國朝洪武六年僧大巖建二十四年歸併靈雲寺今廢瑞鹿寺在西內谷宋淳化二年僧法道建熙寧元年賜額後廢元豐五年僧道親進藥有靈驗詳紀異重建復廢國朝洪武二十四年歸併雙峯寺飛泉寺在東內谷宋天禧二年僧從吉建熙寧元年賜額元末遷于戴辰峯之西絕頂上頂平有泉四面峯巒國朝洪武二十四年歸併雙峯寺石梁寺在東外谷謝公嶺東宋慶曆二年建熙寧元年賜額後廢國朝洪武二十四年歸併雙峯寺本覺寺在西外谷大芙蓉長原入鴈山路從本覺寺始唐乾寧二年建宋熙寧二年賜額今廢古塔寺在西外谷大芙蓉長原因開山祖全了骨塔建古塔菴熙寧元年賜額後廢骨塔仍存石門寺在西外谷宋咸平三年建熙寧元年賜額後廢普明寺在西外谷宋咸平三年建熙寧元年賜額後廢天柱寺在西外谷宋太平興國二年建熙寧元年賜額華嚴寺在西外谷宋咸平二年建熙寧元年賜額淨明寺在東外谷舊名淨明菴宋太平興國二年建嘉祐七年浙漕李復圭愛其山水秀異奏立淨明院八年賜額舊有維摩室今皆廢真濟寺在東外谷宋祥符二年建熙寧元年賜額今廢以上十八剎俱在鴈山東西內外谷中附白巖寺在鴈山東外谷北閤唐元和九年建熙寧元年賜額梅溪有記明因寺按舊志在鴈山東外谷溫嶺石晉天福六年僧德蟾建宋治平二年賜額大明寺元豐三年改今額元仍宋我朝洪武二十四年歸併成叢林永樂元年僧從宰重修後僧嵩大能持呪驅崇復創塔院刻千佛像為明因子院實相寺在雙峯後谷宋祥符元年僧法煥建後賜額紹興中徙於山間後廢崇德寺在南閤石晉天福二年建宋熙寧元年賜額後廢按十八剎者鴈山東西內外谷中諸寺也若白岩寺明因寺實相寺崇德寺俱在東外谷之外然亦鴈山境內寺也合之凡二十二寺菴觀瀑菴一名宴坐菴一名龍湫菴諾詎那觀瀑處八扇菴寺有八菴各理田粮以供役事曰同源曰新樓曰下院曰天然曰柘菴曰雲岩曰曇花曰新菴共田百餘項惟一人住持後因役煩田皆質券於人菴随以廢堂資深堂在雙峯寺後梅溪有記亭看不足亭在靈峯洞取昔人岩前向見白頭翁自道一生看不足之詩而名之也忘歸亭在大龍湫下翠微亭在靈岩靈峯中道相去各五里許西南入淨明寺藍玉亭在雙峯寺側鴈山書院亦曰鴈山鄉賢祠祠宋元暨國朝諸名賢也提學萬先生撰降祝文刻石于祠內知州朱守宣為置祠屋數楹祭田一十畞地一十畞俱在瑞鹿龍湫上寳香巖萬曆八年奉例改創公館仙釋木葉老人宋元豐五年瑞鹿院僧道親於院前道上逢一老人自山而下履木葉皆無聲呼僧與語付一丸藥如彈子大曰爾可速入京師以進此藥乃萬嵗藤膏熬成龍壽丹也以金椀研服可保二九之數道親未行次日又遇之仍趣其行道親如其言至都下適聞仁宗不豫詣省言其狀執政異而不受上聞召而取之問所欲道親言老人但戒太𡻕本命四六慎酒樂乞濟貧民及禁天下捕龜上命中臣梁從政賫香至鴈蕩訪老人無所見八年立春上染疾太后得藥扵睿思殿如前法研服之稍愈及上崩時計在位一十八年適符九二之數紹興末平陽獨嶼李氏子跌蕩不容於父遇一方士將以東逰不移時達樂清孝義橋下去家已三百餘里矣辭不能進方士出一小鏡使窺之恍然抵一山寺俄而如夣覺視其僧舍則已在靈岩寺矣禪僧有逰山者嘗至鴈山中偶失道循小徑至一處有茅屋數十家皆方士也笑謂僧曰爾亦知逰鴈蕩乎方冬沍寒而其地煖桃有實僧摘數枚懷之方士呼童子奪取其桃僧因恍忽過山椒不覺至明州天童寺矣陳覺陳州商也嘗逰鴈蕩東峯望西巖下一木如盖捫蘿至其所見藤蔓纒繞一人其形如石視之乃入定僧也觸其衣隨手而化乃結菴于傍居二月餘僧欠伸張目曰吾有衣寄岩間有虎守之可持吾錫杖以取覺徃見虎示以杖虎搖尾而去持衣以授僧見藤蔓有入僧膚肉者數寸覺因懇拜僧為說法山中鳥獸鬼神皆来聽後人指其處為說法岩今岩在東谷唐堯運即鴈蕩闡化祖師諾詎羅尊者姓羅氏法名詎那又名諾詎羅眉州青神縣人居蜀之中岩山有石笋三峯鼎立其傍惟寳瓶一峯岩岫奇峭林木薈蔚為尊者道塲飛錫來居震旦東南大海際鴈山龍湫餘見開山祖下宋全了永嘉人逰山至荊門玉泉山遇天竺僧言汝縁在浙東當得名山居之永嘉有諾詎羅者道塲數適當興龍湫宴坐此尊者棲錫地也了遂感悟至山中結菴曰芙蓉塔曰古塔鴈山之顯皆自全了發之其人放蕩不拘時人目為了漭蕩餘詳開山下景宣樂清人陳氏子受業能仁寺十五嵗試經得度出逰方外紹興間歸能仁越數年又居本覺後以壽終平生喜讀莊子自為註解凢三十三卷又能究極性命道德之說年九十七雙目烱然視聽不衰及茶毗齒與袈裟皆不壞人以為得道云雙峯寺舊有龍祠相傳僧人曰後可者善講經一日聚眾僧講於峯下有一老人侍聽長鬚古顏眾頗異之問其従來曰某寒坑龍也眾曰寒坑去此百餘里講不逾時何從知之而遽至此乎曰寒坑鴈蕩原是一山首尾相連地脉相通故易知之因忽不見風雷驟起眾僧懼禱請立為祠仰而視之則蜿蜒之狀已在雲中矣祠今在東外谷羅漢洞內設羅漢五百身過客至誠瀹茗則徃徃成乳花洞見前石羅漢在西谷羅漢寺前高崖上崖高數十丈世俗相傳漳州有一羅漢聞鴈山之勝內有諾詎那尊者道塲尊者乃西靈山第五位大阿羅漢也欲來叅受駕海舶至溪下登岸陸行以尋詎那未及見適遇見樵人即飛上高崖上立化為石至今形肖宛然矻如巨人寺因以名逺夣和尚碑文戴洵祭酒號愚齋四明奉化人逺夣和尚者本應天溧陽人袁應魁也有妻子兄弟田宅頗饒一日棄之出遊至雁蕩靈巗谷依僧學佛更名圎魁落髮然不甚禮誦講解嘗掩室靜坐手甲長二寸餘冬夏衣一衲無增减萬曆丙戌夏余偶至靈巖谷與語佛不甚領悟明年忽造余廬謀建寺又明年寺成来請為記余曰天地中有鴈蕩雁蕩中有靈巗靈巗中有寺寺中有爾居之皆夣耳而又記之是夣中言夣也爾方求覺者何記為魁自號鴈峰余為更號曰逺夣而作說以貽之曰逺離顛倒夣想佛教也魁笑曰雖然夣覺不二離夣求覺亦非也終請記之余偶病未得為魁来促之且曰有寺無經佛法何明凡愚何覺吾將造京師謁名公卿請印藏經歸寺以畢吾志余笑曰無欲速果熟自然香姑留與爾共講佛法大意也魁乃留寓塔亭山日来聽講余因以三千有門頌授之自五月至八月始成誦一日席地仰天余曰雲行鳥飛佛體也魁笑曰自古只有僧為儒說法今公反以儒為僧說法亦異事良久忽起附余耳自指鼻尖低聲曰我雖不解文義然常常照管主人翁時刻不忘者二十餘年矣余始異之前欲與深言竟無語留凡一年余記成辭歸靈巖余以二絕送之曰昔住靈巖寺今留佛塔亭寺亭俱佛境若夢若為醒昔來真如夢今去夢還真寄問雪巗石真知夣裏人明年余養病西湖净慈寺魁忽来曰吾杖鉢来竟將徃京師何以贈我余取一手卷畫靈巗圖書逺夣說其後授之曰都城繁華尔其時覺本真無迷也魁竟去逾年不知其所遇何如又明年壬辰夏南宗伯王公寄余書曰承遣魁僧於今年正月二十六日已在玄真觀中坐化矣此僧與之語若無甚見解而臨去一著乃爾豈真有宿根耶余猶未信之已而其徒明海負其骨歸為余言其化日如常時但獨語曰印藏經自有時今亦已矣遂瞑目猶謂其晏坐不知已化也化之日面色微青明日轉紅潤如生七日而鬚髮漸長都人瞻禮紛沓玄真觀主郭懷野懼多事陳於禮部請從茶毘王宗伯乃命具龕薪火之烟皆西向時二月二日也年五十六世傳得道者多坐化或立化色臭無變每疑其妄今觀於圓魁猶信嗟乎余未知魁所得果如何顧世之學道者誰識所謂主人翁而照管之哉主人翁盖即釋家之本来面目僊家之元神儒家之慎獨也認本来面目者常止常觀耳不在持經解偈也存元神者常清常净耳不在烹鉛錬汞也慎獨者常戒常懼耳不在多聞多見也彼其所以不言不為如愚如訥既屬予以建寺又屬宗伯公以印經而竟又委之長徃無藉焉安知非古佛應世而特啓吾二人以聦明學識為無用耶退之之大顛示以形骸可外子瞻之了元使知性命所歸吾是以深信魁之以覺覺吾夣也而又深愧吾之方夣方未覺也冬十月宗伯公至錢塘邀余遊西湖公之子汝龍壻黃廉語余曰魁化之三日親徃瞻禮挺身端坐兩手俱仰一上一下不著胸膝掣其肘可開闔盖兩肩猶軟云遺一偈蓐間曰自古原無死無死亦無生作一黃梁夣亘古又亘今明海将歸葬靈巗谷樹碑宇下請余為銘銘曰混溟一氣化變日新形凝質具有物有人維人最靈誰為之主不見不聞常出常處出周沙界䖏守一中三教攸判主一是司舍我主人𥳽弄軀殼棄本逐末終迷妄覺於維魁公晦迹韜光不解文義自得知常常為變主變則常使主之所之使即随至既搆殿宇復摹藏經功成不居飄然西行主人既去留此遺蛻鴈谷都城為客寄在寄如夣夣亦何因既覺求真真復何存即夣即覺非真非假覺既無取夣奚足捨峩峩靈巗靈骨斯藏敬述遺蹟以表不亡
