林龍湫偶書十年清夢此山遊雙舄今經山上頭不為叅禪尋鴈宕偶因看瀑過龍湫峰攢天柱雲霄近目極星槎江漢浮遙憶前身卧牛斗道衣猶記泛東甌逰鴈山歸途張國紀教諭號瑞岩安吉人摘璧攀蘿覺倦逰蒼崖翠已深秋囬看鴈宕天猶近夣想龍湫水自流謝客登山偏有興陶公載酒豈無儔啣杯落日溪亭畔應怪山靈不見留逰鴈蕩俞邦韶號鑑湖新昌人芙蓉萬朶植雲衢叠嶂危巒倚翠微泉瀑龍湫光奪日風生靈谷冷侵衣石梁橋下魚従躍天柱峰前鶴自飛盡日躋攀登絕頂恍疑有蹃接瑶池靈峰洞陳謨號鳴峯樂清人誌公道左報靈峰未躡夷庚興倍濃乍接㕠巒供逺翠囬看五老斂傾容巖扃泉落瓊珠溢洞口烟封錦繡重再拜應真為我貯休捋佳趣付塵蒙靈峰洞青嶂蒼崖此欝盤僊庭俯瞰碧霄端草間石碣年難辨石上飛流夏亦寒雲斂洞門𡚖五老天空木末下雙鸞泠然已出人間世勾漏何湏問大丹靈峯洞李含樂清人貢士捫蘿磴上崔巍古洞隂隂天際開地逈金人隣斗極年深石碣翳莓苔玄猿接臂巖前掛老鶴聯翔雲外迴兀坐泠然忘幻想恍疑身世是蓬萊靈巖寺王士昌給舍臨海人絕壁沿廽勢若墉青天忽墮翠芙蓉地雄轉覺林巒壮雲靜方知澗壑重屏隱霞標迎玉女崖懸石乳掛蒼龍鴈湖更在諸峯外済勝還湏九節筇靈巖寺何湛之参議南直隸人磴道盤雲歷翠微石屏霞嶂欎崔嵬泉珠滴瀝龍孤卧岩頂蒼茫鴈幾囬插漢數峰鵉鳳舞叅天一柱斗牛廽啣杯白日衣裳冷萬里扶搖海氣束五言古詩晉斤竹澗越嶺溪行謝靈運猿啼誠知曙谷幽光未顯岩下雲方合花上露猶泫邂逅傍隈奧迢遞陟陘峴過澗既厲急登淺亦凌緬川渚昃徑復乘流既迴轉蘋萍汎溶洋菰蒲冐清淺企石挹飛泉攀樹摘葉卷想見山中人薜蘿若在眼握蘭勤徒結折麻心莫展情周想為美事殊竟難辨觀此遺物慮一悟得所遣石門山晨策尋石壁夕息在山捿疏風枕高館對嶺臨迴溪長林羅戶庭積石擁堦基連岩覺路塞密竹使迷来人忌新術去子迷故蹊活活夕流駛噭噭夜猿啼沉冥豈別理守道自不擕心契九秋榦目玩三春荑居常以待終處順故安排惜無同懷客共登青雲梯夜宿石門朝搴苑中蘭畏彼霜下歇暝還雲際宿弄此石上月鳥鳴識夜棲木落知秋發異音同至聽殊響俱清越妙物莫為賞芳醑誰與伐美人竟不来鳴珂徒晞髮宋逰鴈蕩梅溪鴈山五經眼兹行尤可觀初冬天氣佳鴈歸山未寒有日照幽谷無雲翳層巒入景見常雲振衣登馬鞍瀑泉飛玉龍羽旗導翔鸞石柱屹天外卓筆書雲端靈峰觀石室杖屨穿巑岏山禽知我来好音若相歡羣峯列春笋丹青状尤難行色愧匆匆更約他時看度謝公嶺十九年行役屢經此山中愛山不厭觀每愧行匆匆大士瞻詎那騷人思謝公一生看不足語如白頭翁逰靈岩靈峯寄輝老禪鴈蕩冠天下靈岩尤絕竒烟霞列屏障平霞障日月明旌旗展旗峯岩前有卓筆可以書雄詞卓筆峯天聰况非遙洞然聽無疑天聰洞願起靈湫龍雲雨行可為大小二龍湫願用真柱石永支廊廟危天柱峯願煽造化爐四海歸雍熙煽鞴爐峯願拈鸞鳳友朝廷相羽儀雙鸞峯何人夣石室妄談夸一時石室洞那能了世縁未免貪嗔痴名山誤見污公議安可欺願借龍湫水一洗了堂碑詩以寄老禪狂言勿吾嗤逰鴈蕩范宗尹一徑入幽谷隨山幾縈盤雲樹深蓊蔚石溪自潺湲我来春色曉山花亦何繁好鳥不知名向人自闗闗遣我發興新探討忘疲艱龍湫信竒絕飛泉落雲間快瀉萬斛珠濺沫霜雪寒尊者所經行草木不可芟敢将塵土足濯此清泠灣晚投山僧家山作碧玉環高堂極虛明可寄須更閑此行端為山山窮我當還明朝驅車去依然随塵寰勝趣未嘗忘神逰清夜間和立齋先生鴈山韻宋車若水號玉峯黃岩人洗山出穹石削空蹲蒼城一清屹萬古何物相與形步涉貪深逰往往神所兵立齋立千仞天地鑑清聲平平遡龍準不見猿鳥驚斯道今泬寥斯人世重輕檠天隻柱健此嘱誰堪膺逰靈岩一徑碧如合四山危欲堕天低鳥不飛露濕龍常過岩根小葉下境淨不可唾深香洞出雲冷鐘佛驚卧川僧住八年有此清福大而我尋盟来坐借蒲團破燈深眼雙青各話其所課我榖未必實他華已成果歸来冝有餘吾道豈全懦壁閒清獻存當年愧輕和宿靈岩贈長老敏行梅溪籃輿謝公嶺杖屨詎那室淨名訪維摩一菴僅容膝尋僧畵屏中往往多八十平生看不足靈岩最竒特靈岩有看不足亭老禪蜀中来心印傳佛日脚力窮天下稱此為第一敏行自西来歷諸名山謂無如鴈蕩山之勝茲山昔未開藏閉最深密儻不遇熙明造物肯容出孫公賦天台勝地尚遺逸我欲續金聲願借山中筆峯有卓筆元大龍湫陳剛字公潛平陽人號潛齋出寺西北行怪石立前後隂沉傍羣木苔徑修蛇走蒼崖迴合中仰視天半畞玉龍千尺飛散作風雨吼碧澗搖空濛餘波蕩林藪人言發源處空洞蟠蚴蟉與叔夏逰石門叔夏有狠石忽中斷勢若兩虎闘之句予輒足之李五峯狠石忽中斷勢若兩虎闘白龍来喚之喚一作嗅仙聖不敢捄想當二物爭雌雄憑夷擊鼓張其咮日車為之翻地軸為之仆至今兩門開天遣百永湊永一作水吾聞神禹疏龍門蜿蜒偃伏夾左右坐令遺黎收樹藝嗟哉神龍之功獨何有觀龍鼻天柱贈欽上人天根盤海底大浪舂其南眾山盡萌芽迸出碧玉簪濤波蝕之半玲瓏兀空龕其隂生琪玕其陽産楩楠絕頂逼太白纔可一劒函銀河従天来白鳳毛毿毿魚龍撼不醒醉如卧箔蚕其中黑無底銅杖不可探一綫出山腹牛乳清而甘清寒潄草木日出香馣馣雲霧忽捲去玉氣射紫嵐千峯碧菡蓞春霞散紅酣或黝如蒼璧或青如挼藍或樹旗杠一或覆鼎足三或抉如怒猊或呀如洪蚶或如馬善踶或如虎視耽聳者如樓觀窽者如罃甔仰者如箕踞俯者如負儋或螺髻紺日儼雅如瞿曇或厖眉鮐背傴僂如老聃矯如天女戯卑如童子叅萬鬼若斵削天巧未易談招提十八寺過者常挽驂中有天人師久卧老栢菴法界如塵沙一一毛端含長風吹逰子鬢髮青䰐鬖幽尋忽至此佳處若已諳我家鴈山頂擇勝不敢貪但悲食塵子腐作書中蟫相逢一大咲新詩出長錟明朝芙蓉路惟聽霜鍾韽同靳従矩宿鴈山天柱院東南地勢下海水復善齧青天久軒輊獨見斗柄揭古帝省下土東維成欹鈌大靈駿奔走蛟螭攺其宂浲水縮地入萬鬼拔山出想見風雨黑電火上下掣兩柱俄支撑真宰仰咋舌遂令天行徤不復見卼臲鬼工妙斵削又不見剜一作日月轉半腹隱避若兩蝶我夜卧其旁戶外白如月開戶天冥冥岝崿立積雪居然混沌素元氣淡不裂平生山水性念此心屢結緬懷萬物初天地亦芽蘗眾人如螻蟻細大強區別俯仰聊自喻白雲一怡悅亭午日氣近鳴鳥着清樾我㒒膏我車前路在𡺑嵲國朝黃淮端居困沉鬱薄逰暢幽懷鴈蕩夙所慕素志今始諧陟境思已清歷覽萬像詼屹如錦屏列粲若青蓮開一柱擎天起日月相往回羣峯走其下聮絡羅嬰孩誰提并州剪越羅不可裁誰立趙壁幟勁氣那能摧玉女跨雙鸞昂身紫霞堆邀我綰卓筆灑墨題蒼崖石梁險莫測飛虹架迴溪側足難徑度佇立空徘徊或云神斧運剗削搜坤倪或云洪濤湧衝激遺䈥骸詭状欲窮詰妄執成疑猜龍湫洩嵌竇珠散瓊玟飄然隨長風雲霧排空来詎那清淨觀跏趺據崇臺佛剎十有八廢址滋蒿萊存者僅六七甲乙推次排能仁據其會金碧耀璇題鍾梵逺相緇流互相攜追尋謝公跡陟嶺登崔嵬摩挲舊碑碣殘缺湮莓苔懷賢發清嘯驚起𤠔聲哀更欲尋鴈湖肩輿倦扳躋從逰諸君子秀拔皆英才主席二老禪法相真獅猊欵留動洽旬展席傾尊罍賡和鏗金石談笑驅風雷懸車絕塵想此樂信悠哉採芝與斵苓聖訓近可稽少保文簡公致任宣宗皇帝御製詩以送之米云鴈蕩峯高清不極中有謝公舊逰迹採芝斵苓可長年應在天南憶天北維昔李謫仙名與廬山齊覽勝發豪句曠達真吾儕人生百年内弱草棲纎埃題詩紀嵗月重逰能幾回北鴈歩虛詞鄭善夫號少谷郎中閩縣人昔我夢翼飛去與王子親雙雙鸞鳳簫吹破緱山雲翻身大火坑洗髄明河津芔然馭白鹿下宴瑤池春枉駕鴈蕩隂玄冥閉天閽醉掃千丈石萬刼留至文只今靈峯洞元氣猶氤氳悲歌草木偃坐嘯天地聞歸来鏟光彩大隱金馬門君看東方生至人伏垢氛詎那不了道一壑空云云送葉澄逰鴈山還金陵兼呈大司馬喬公顧璘泛覽名山圖鴈蕩天下竒天吳舉蓬島亂擲滄海湄巉岏老蛟脊結曲蟠桃枝攢峯蔽青冥星斗晝陸離靈湫到銀漢六月飛寒澌仙人隱洞府玉簡靈文垂白石充餱𩞯紫芝可療飢鳳笙乍縹緲鶴駕時逶迤綠髄茍未變丹梯詎能窺葉子道者流夙禀烟霞姿去年逰武當未愜心所期今春策短杖直往了無疑天台逢高生拍手欣相持遡流問桃源探穴尋仇池俯瞰不測淵仰攀萬仞危端坐天柱峯要觀日出時扶桑射東影照見蒼龍鬐太湖僅一勺匡廬忽平夷呼酒酬蒼梧鳳鳥来何遲浩浩浙江濤伍胥今為誰桃花落已盡芳草含碧滋啼鶯勸客飲正與烟光宜滿舉白玉斗吞却東南陲坐覺方寸間雲嶠相撑搘歸来回風亭目光如玻璃磈磊作竒盡琳琅吐新辭顛倒雷電走蒼茫神恠悲十日說不輟齒頰生涼颸四座煩鬰散聽者俱忘疲靈秘自此洩海若安能私還拜大司馬請陳賤子詩定知巑岏勢縱橫列階墀迢遙金銀闕夢寐如見之謝客休掛席孫公應解頣何必舉五嶽高下論等差至樂有同好難與俗子知石梁王獻芝鬱欎蒼翠墟中隱維摩居採藥茹石髄吐氣升雲車𨶜虎化石梁殘僧依洞虛煮茗酌飛泉共吸玄汁餘小龍湫錦屏百尺餘萬斛洗珠絲紛紛逐金泊流波半崖飛明霧抱石随風馳餘霏忽霑衣變態無常期愛爾晦靈跡破棘探幽竒卷石辯古痕索隱同我蚩攀崖坐磯石悠然思委蛇入雲峯孔天胤所禀幽石姿因心愛白雲欣茲採秀往涉此連山雯輝潤忽屢回輪囷互氤氳似煙流非薄觸石出逾殷總與太虛混都無區裡紛芝盖倐已翔羽人其来羣帝鄉倘可至豈羨雲中君鴈山夜坐趙廷松號俟齋副使樂清人朝搴苑中蘭畏彼霜下歇宵吟謝公詩清歌達明發節換心屢驚年徂變玄髮溪水鳴岩瀕涼風響林樾澗戶暎疎星石梁橫天闕空虚宜留人光景坐超忽懷人竟不来西林照殘月靈峯洞吳子孝推官吳縣人神岫矗坤萌危巖啟天竇丹梯邈龍偃涼風乃金奏鏡沼竦碧幹渫雲麗玄囿允協丘中懷江南獲靈覯飛旋淩九霞楊𥙞采三秀悅彼乘鸞迹願躡安期後靈巖紆組外塵慕躧歩仰天逰霞嶂暎新綺玉峯倚澄湫雲深翠壁淨谷窈丹泉流閬風未足儷珍恠焉可求餘方捫石厯遐靈庭幾竒賞矯首獨夷猶龍壑軒夜坐日入紫霞沒天空玉露清萬境盡竒絕諸峯更分明海鶴靜夜夢山蟲高秋聲步蟾起綴句靈洞孤雲生靈嵓次韻吳朝鳳號南岡叅議樂清人行眺入靈谷天邊無數峯石龍奮鱗甲雲屋隱喬松逺日騰海蜃高風散寺鍾秋光未蕭瑟岩壁見芙蓉龍壑軒次韻露下看牛斗隂隂毛骨清霜寒山鬼泣風細天河明孤亭懸夜榻萬籟送秋聲隱几談玄罷山頭新月生石梁次韻長虹起東海故將青天遮隂洞生虛白清尊引落霞雲開鳥堕影巖漏雨生花摩崖訪真迹前村日半斜逰龍湫遇雨吳仲禮客子數偶窮龍湫忽烟雨山靈詎我尤造物忌多取余僻良莫排衝濕厯其阻幽攀直到雲果往無却武危亭小爾憇茲景疇績組一道擲長烟四塞皆噴霧乍止神骨定番思髮毛舉嵐動欲浮嵓霆吼兀撼柱豈獨蒼壁懸似盡銀河吐深山大澤中底事相眩瞀但恐真物在變化失昏午異哉立海濤鱗甲紛四顧綃已控鮫人珠誰散天姥睠兹活潑勝語大盖不禦地猶局有所天更無方助我中發長嘯三才無所