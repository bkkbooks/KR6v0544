小圖附樂清志一峯而三二名者各随其寺所見又合為大圖二大抵東西四谷自縣往者由西始西外谷有寺四曰古塔靈雲寳冠石門其流水大芙蓉港出纜嶼其路平夷西谷有寺七曰能仁羅漢飛泉普明天柱華嚴瑞鹿其水自峽流䈥竹澗出清江皆峻嶺自石門来者曰東嶺自芙蓉来者曰丹芳嶺自䈥竹来者曰飛泉嶺達于東谷曰馬鞍嶺東谷有寺四曰靈岩淨名靈峯真濟其水自峽流白溪溪上有路通白溪驛驛舊在嶺南白溪今徙于白若嶺比大荊曰嶺店驛東北有嶺曰謝公嶺達東外谷有寺曰石梁自石梁東北至雙峯以達黃岩左有谷曰南北閤南閤乃鴈蕩之北有崇德寺水自蕩頂分流山亦竒勝舊圖不載今附焉見其大槩云國朝逰鴈山詩序方石謝鐸侍郎太平人成化庚子予以憂解官南歸越三年従吾叔父太守先生與一二布衣陳敬所郭筠心諸公登方岩望天台鴈蕩盖蓬莱三島諸仙人若可招而得謂極吾山水平生之好將自兹始矣未幾復有所掣不果遂明年乃逰塔山又明年謁番易應先生宿流慶寺先生曰吾老矣逺不可至若聖水諸公能相與一行乎又明年余秋崖存敬聞之請為東道主以遂尋兹約濵行忍菴章公遣其子玄貞來邀登鴈山予重違番易之約未果也既而番易以疾報遂輟存敬之請乃從太守先生偕敬所筠心嶼南諸公過忍菴所越宿度謝公嶺臨照膽潭入靈峰洞過靈岩觀天柱卓筆展旗諸峯至龍鼻水而止扵是忍菴之從子黃門君来會既暮抵能仁寺而止宿焉明日還過大龍湫觀瀑布望鴈湖絕頂相與咨嗟嘆息以為天下之竒觀盡矣遂復由故道過忍菴而宿又明日乃歸九月十日也嗚呼鴈山在東南名天下舊矣吾相去不數十里而往来于心者也不啻數十年乃不得一至暨其至也復輟聖水之行而後果豈茲山之遭亦固有數邪夫以數則一山之遭且不易得然則吾人知得以詩酒自於溪風山月之間以相與優游扵太平全盛之世者可不自賀其所遭之大幸也哉雖然山水之樂在天地間固取之不窮而得之無禁然極意之所向而過之亦皆足為害又豈但富貴利達間哉吾用是愧無以上酬所遭扵萬一而又懼若茲山之遭樂而不知所極也敢質之同逰諸公與吾太守先生不識亦以為然否聮句凢若干首其名字各著于下方而凢諸同逰者亦得以次見焉修鴈山志序潘倣踰浙水以東多名山東南近海上尤秀絕天台四明鴈蕩天姥皆為天下大觀而選幽探竒類以鴈山為首前典漫漶無所考蕩南朱先生今始克志之而於鍾靈以名世者顯晦利鈍小大類以傳輯間嘗閱之恍然重有感焉其竒峯疊嶂𥓂砑嶮巇立者如植蹲者如傴起而迎者如奔背而去者如逝邐迤者如舞目左右接不暇蓮花諸峯也其勵拔有如此者其雲崟煙龕雪崖風洞如迸笋垂乳如綴珠懸旒如神剜鬼鑿如複道如陶穴如蟠螭如刻畫雲烏火藻波瀾之狀龍湫諸谷也其空洞有如此者其川源觱沸而溢如洄如洑如震如泝其清可酌其湍可濯其勝可亭其可百折而東赴于溟渤劍峯諸泉也其雄渾淵澄有如此者勵拔者存乎介扵是乎有獨立不懼者出如章恭毅公者先之矣空洞者存乎通扵是乎有守玄抱虚者出如夏玄鼎者先之矣雄渾淵澄者存乎知扵是乎有旁行不流者出如李孝光者先之矣先之也者先之也豈天地精華之氣將秘伏于古而廼蓄洩于今邪吾將以俟之吾将以稽蕩南君之考成也否則天下山川泉石之勝不少如鴈蕩者其何以為天下之大觀予與蕩南為舊同寅會間出是編以相可否謂余宜序諸首予弗獲辭遂序如右修鴈山志序鴈山瀕海高出霄漢間東南望閩粵西北連四明天台以接栝蒼其發原固不知其所始也其趾之盡垂入海嶠斷崖千尺下臨巨浸自浙以東凢山之名勝奥邃者必首稱焉唐一行畫天下山川為南北二戒以南戒盡扵鴈蕩豈謂巴蜀湖南之山趨金陵度錢塘而歸宿結秀扵是邪他山泉石之竒者或以一二得擅名扵寰宇中而獨茲山累至千百尚未有既豈造物者藏無盡藏扵遐方僻壤之區待時而洩邪則知風氣之開闢有漸至是而盡發扵南服也夫天作高山奠為五嶽効靈育物之功紀載于典籍者嘗昭昭矣宜乎享珪瓚之黃流而勤先王之祭告也鴈山之峻極峭拔無讓乎五嶽之尊崇神龍攸宅時出雨雲羣峯駢立飛瀑交流轉步瞬息百態呈現較扵五嶽而幽邃之景或多過焉自晉唐以来始得列號扵輿圖以地出偏方居非中土去先王望秩之跡或逺耳夫以天地之所覆幬者大而觀之則崑崙以東積石以南際于海隅何者非吾中原之地先王聲教之所覃被者邪不幸而有所蔽翳阻塞非山川之不迨也顧聲教之所沾被有未贍耳厯世多而幅𢄙廣然後向之蔽者日以開塞者日以通故雖薄海塗泥之鄉名山絕境亦得以通舟車萃衣冠招士夫以遨逰託文字以張皇而盡洩其秘蘊此鴈山之所以名天下者沿至我朝而益著也吾嘗考夫一統志矣浙下名山若天目會稽四明天台金華歷𠪱可數而見較其秀異誠未有如鴈蕩者焉國志録其槩郡乘未盡其詳四方之人亦徒知其名而未竟其實也古人云緊絆芒鞋走一月彷彿見得皮膚耳諫也幸竊茲山形勝之餘託處扵南趾之麓藉桑榆以卒却外慮而夷猶故能發剔幽眇補葺舊志以為是編其有未備者以俟後之同志焉矦一元嘉靖進士敘曰自昔通方逺覽之士曷嘗廢觀游哉夫既孜孜飭其本務矣然而弛張勞佚必有所寄是以襄城命駕彌劭皇道卷阿弛馭無累王業而夏諺扵焉顒首周民以之子来上下俱欲莫以為病至史遷用周覽抉竒謝傅以丘壑弘望咸獵精乎觀物之間斯又益矣方今天下名勝類有圗牒然多偉其所見墨守一隅至談吾樂鴈山皆云并難具美良以四谷秀巫山之雲蓉谿含武夷之曲鴈湖蕩具區之波龍湫下匡廬之瀑是以謝公之屐千里来臻輶軒之使以為茇舍莫不激賞盈襟形於篇什以故前志蒐録輙成巨卷後賢繼起復遍厓碣𠃔哉山川之遇也嘉靖乙巳我邑侯歐陽先生至自西蜀蜀故多竒而先生冲襟雅有五嶽之尚既下車問俗一至鴈山即歎其巨麗冠絕東維而追昔所游以為未至人謂先生且日命習池之駕暢滁山之飲而先生事已即旋樂而弗留無何值嵗洊饑海有刼寇縣官調度兵食以憂民日不暇給盖積嵗廼定而先生之不至鴈山且久丁未秋御史河東裴公来巡弭節茲山爰有登高之賦于時海平野闢先生幸以無事禀法于下廼從寓目佳麗諷詠篇撰嚮者之樂始復在懷慨然自以不易得也爰屬千峯吳先生并裒近作斷自前志蒐其所遺以為續集既成視余與諸生徐子世鑣校而傳焉嗟乎息游之道通于有政觀侯循行勞來張為弛前講藝宣和佚為勞後文武之道不其該歟侯又嘗言天下衰盛於鴈山有占以為鴈山之聞自晉始也及唐而微宋初盛時猶未甚顯鴈山之顯廼當宋室之南於是金碧被峯巒而山之名勝始爭衡丄國矣將不以偏安之國貴游所凑而一統之世車軌逺之乎我國家奠極北方鴈山逺日且萬里則雲構復圮緇黃流散至于今草中廼卧大爨鑊焉固其理也逰者徒知想故事之榮華吊山靈之憔悴曾不知景員之奠殷崧高之蕃周也深哉觀乎其有天下之慮矣斯集之成亦以羽翼往記貽之方来俾範治則不滛于逸論世則不泯其文所謂舉而必書以觀後嗣者豈徒鋪張靡麗勧百而已哉余故不辭校而敘之鴈蕩靈巖寺疏序戴洵祭酒號愚齋四明奉化人余徃在史館得李容縣所刻宋吳元美勾漏洞天十記讀之謂其石峰矗立巖穴勾穿卓絕雄傑非豪楮可及心甚異之恐世間無此也後出署留院又得游名山記中有宋李孝光鴈山十記謂緊絆芒鞋行一月彷彿見得皮膚耳心益異之此真可與勾漏競勝者乃自開闢来獨宋人能發其勝何耶豈山川顯晦亦自有數非偶然者耶後自南雍謝事歸家每風恬日和出歩郊野間見清溪白石綠草蒼松欣然會心因念勾漏在西南萬里外即葛稚川竟不能到已矣鴈山在東甌去四眀僅數日程杖策可至何空爾夣遊也遂决意一徃適少司馬中丞溫公行部至嶺店驛舍邀相見歓然道舊明日相從入鴈山而天雨雲霧冐山頂不可辨然所經石梁洞靈峰洞靈巗谷龍湫谷則固神劖鬼削竒詭不可名状時司馬公騎從僅數十人石梁靈峰洞中寬廣猶可容靈巗龍湫則屋一布兩席騎從皆露立雨中即欲少留盤不得也司馬遂冐雨馳去余獨留宿明日雨霽上下流覽則峰巒洞壑吐露頭面指述難遍即勾漏信有當亦無以過之始知僅得皮膚者之非虛也留數日僧圎魁備言徃時有十八寺有田數千頃今寺宇盡圮田皆入民家圓魁自金陵来結茅而栖乞食而食也余謂此寺與田必皆當時達官貴人所施捨者古今人一也何今人遽不古若耶相與嘆息而別歸家數月念未甞不在鴈山下也一日圓魁忽持䟽簿至力請所以為興復者余念有頻婆娑羅乃能立竹園精舍有須達乃能買祗陀園地當今誰可語此獨平湖五臺尚書也乃具書令圎魁徃請果得百金并以法住記見貽惟司馬公亦給以二百金也然工役頗鉅事力難贍夫不有創始後將何因不有多助始将何成今五臺公始之矣更望高賢達士相與助而成之也鴈山僻在東南海際舟車所罕到或以逺不相及為疑然余甞遊岱宗亦有靈巗寺親見河南北淮東西及關陝川蜀之人日接踵至施舍不倦盖山川靈秀與人之精神默相通感豈必以逺近為間隔耶竊謂天地間有鴈蕩則必有阿羅漢如諾詎那者為之啟道塲有道塲則必有戒行僧如行亮神眧者為之興殿宇有殿宇則必有喜縁事如蔣光贊者為之助貲力興者不能不廢而廢者不得不興造化旋轉原自有不可測者今圎魁雖不甚解經而持齋守戒不少渝未必非今之行亮神昭也鴈蕩之興此或其時余恐疏簿所至不甚信之故為述其縁起如此以告夫樂為蔣光贊者逺夣說贈魁上人并序戴洵圎魁上人自鴈蕩靈巗寺以去年九月至吾廬乞為佛殿記余病未能也日與譚佛法欣然會心因寄語塔亭山慿虛閣日来聽講至今年六月不去余嘉其誠也為寫其像祚逺夣說以贈之他日歸靈巗日誦其說猶日對吾講且使後之人知靈巗由魁僧而重興也靈巗僧圎魁自號雁峰余謂其近於俗也為更之曰逺夣而語之曰爾學佛者而不知佛之說乎佛者覺也以世皆夣也今夫人之在世也眼耳鼻舌身意結而為我非根乎色聲香味觸法浮而為他非塵乎塵對根而景立焉根交塵而情生焉方其情景之相入也或欣然以快或拂然以恠膠然若不可以解及己於事而寂然無一在也茲非其夣也耶夣之中未甞不自以為覺也及已覺而後知其為夣也今之欣然怫然而自謂膠不可解者安知非在夣而自以為覺者耶夫自我謂他則他為塵也由他謂我則我亦塵也浮塵變滅寧有定體浮塵流轉寧有實事是故去不可追今不可執来不可冀也是以謂之夣也是故自世之無始以来二帝之所讓三王之所伐五覇之所爭七雄之所奪貴而侯王卿士賤而執鞭衣褐冨而櫝玉籝金貧而履穿衣結及乎今而皆泯然盡絕也是世世皆夣也自我之有生以来幻之所弄者長已棄之矣壯之所營者老已忘之矣是皆夣也一嵗之中朝之所為者及暮而已改室之所作者出門而已違是日日皆夣也豈惟人哉日月星辰之旋轉風雲雷雨之聚散春夏秋冬之代謝盖木有一息安其故焉又安知天地之非夣也耶即如仲尼之論語二十篇伯陽之道德五千文釋迦之說經十二部自以為覺當時傳後世而不知杏壇之講席關門之牛駕祗園之法筵其陳迹之不可尋也亦久矣又安知三夫子之非夣也夫夣何從来也心所想也心想而攀縁生焉攀縁不已而係戀生焉係戀不已而憂畏生焉係戀則趨憂畏則避趨避者習於為而後感結者形扵夣故夜之所夣皆晝之所為也然則晝之所為即夜之所夣也皆想所致也非有二也無想則無為無為則無夣矣故想非無也順其理而不以人情叅焉猶之無也故無愛於色而目自視無悅於聲而耳自聽無羨於香而鼻自嗅無嗜於味而舌自甞無藉於觸而身自應無耽於法而意自知順扵理者拒不扵外逆於理者不留於內順不拒而情景俱融靈光普照逆不留而惑業俱解魔障何依是謂不想而實無不想也雖想而實若無想也依此者謂之正悟背此者謂之邪迷邪迷即夣也正悟即覺也夣所以溺於世中覺所以出扵世外此佛說也亦孔子老子之說也此三夫子之所以至于今稱為先覺也嗚呼圓魁誠依吾說而修之則知根塵不為樂生死不為苦四海不為廣丈室不為狹須彌不為大微塵不為細曠劫不為逺瞬息不為近黃屋不為尊草廬不為卑眷屬不為戚仇讐不為疎禪坐不為定循乞不為擾靈巗不為常住塔亭不為客寄聽吾講不為佛說對眾語不為俗談迷與悟無容辨而夣與覺無處尋矣不然世弱世情雖學佛終為夣中說夣也何逺離之有記宋記鴈蕩山見筆談沈栝字存中湖州人溫州鴈蕩山天下竒秀然自古圖譜未嘗言祥符中太宗時因造玉清宮伐木取材方有人見之此時尚未有名按西域書阿羅漢諾詎那居震旦東南大海際有鴈蕩經行雲漠漠龍湫宴坐雨濛濛之句此山南有芙蓉峰下有芙蓉驛驛今改于嶺南曰窰奧驛前瞰大海然未知鴈蕩龍湫所在後因伐木始見此山頂有大池相傳以為鴈蕩下有一潭水以詩名之也謝靈運守永嘉凢佳山水遊歷殆遍獨不言此山盖當時未有鴈蕩之名予觀鴈蕩諸峯皆峭峻險怪上聳千尺穹崔巨谷不類他山山皆包在諸谷中自嶺外望之都無所見至谷中則森然干霄原其理當是為谷中大水衝激沙土盡去惟石巋然挺立耳如大小龍湫水簾初月谷之類皆是水鑿音曹之宂自下望之則高崖峭壁從上觀之適與地平以至諸峯之頂亦低扵山頂之地而世間溝壑之處皆有植土龕岩亦此類耳今成臯陝西大澗中之土動及百尺逈然聳立亦鴈蕩具體而微者但此土彼石耳既非挺出地上則為深谷林莽所蔽故古人未見靈運所不至理不足怪也鴈山記袁采鴈蕩山溫州樂清東北山之通名也去縣九十里而遙越白沙武芳林達芙蓉逾窰奧過長原始至其山凢山有名號者盖純石而土山不預焉宋太平興國二年丁丑太宗時僧全了始居山之淺者曰芙蓉菴今能仁寺是也己卯僧行亮神招居山之深者今靈岩安禪谷是也天聖九年辛未僧文吉得山之盡東而居者曰碧霄菴今靈峰是也於是有民居矣皇祐元年己丑縣尉甄昻乃發蕩隂山今南北閤是也由丁丑至皇祐己丑七十有三年此開山之嵗數也東盡縣之境止溫嶺西距白岩在蕩隂北閤底今有白岩寺南距玉環山在海中北距蒼山在永嘉南溪此盡山之地勢也名山之人多矣或以義或以象或以跡或以無稽以跡獨侍郎岩則為胡兵部居之而言以義則見而可知以象則聞而可知以無稽亦見而可知此山之佳異者也蕩水南出為大龍湫東南會于天柱飛泉南經䈥竹入于海蕩水北出為新溪東流會于寒坑板藏大溪俱永嘉界大溪即南溪南入于海經甌江入海石門之水分自大龍湫經長原入于海自芙蓉溪入海石城之水會于小龍湫經白溪入于海此水之勝者也舉山無崖崖鳥名似鷹而稍大生於海崖中每秋末波海海邊居人謂之曰崖其色蒼白色亦謂之白崖又曰搗崖以其勢能攫物自上而下有如搗也有禽黃色而差小焉而謂金雀有一種羣鳴而聲相抑揚謂之山樂官有獸如鹿而能𠪱險謂之山羊白者如雪猿有毛如狨謂之金線此鳥獸之異者也故詳記之詔復能仁寺碑記曾建郡守乾道七年春臣奉命守永嘉郡道經鴈蕩山見大梵宮號能仁時思薦福者高甍巨棟包原亘壑若可容數千人入其門殿閣岌岌如將壓焉堂下草深尺許突無炊煙浮屠才六七人尫羸聵躄聞太守至扶曳出戶臣愕眙久之問寺所以廢狀老僧前曰寺故名能仁山川紺宇之勝甲于鴈蕩常以嵗時日食千人今聖朝太上皇后母弟太寧郡王請為奉先之地加賜今名然未身至寺也豪僮黠隸之往来者幸其主之逺憑藉聲勢並縁為奸伐木于山取禾於廩惟意所欲浮屠相率去之其不去者非老則病由是十五六年之間寺日以毀僧日以散某軰且死遂無復僧矣臣聞其言而悲之將有請於朝顧念便殿臨遣之意專以救荒為職他未敢先也視事才兩月詔以太上皇命除時思薦福之名復為能仁寺詔下之日老稚歡呼抃舞若人人受上之賜夫以元舅之尊專一蘭若雖僮奴橫恣如前所陳其事至微眇也永嘉崎嶇山海間去帝所千里而逺蕞爾浮屠之病何由而聞於上乎聞扵上固難矣何由而聞扵太上乎幸而得聞察不察未可知也昔者孝武皇帝王皇后終不知其弟武安侯之短猥曰人皆藉吾弟此人情之常也今太上皇后發德音述慈訓出於常情之外非有姜任之德能如是乎寺之所病非一浮屠未嘗敢訴何也以事關貴戚勢或不行懼且得罪明詔既下則皆相視愧赧然則天下事有未嘗訴而曰吾不敢者非愚則誣皆聖世之罪人也浮屠從瑾主之未數月一日緇流四集塔廟一新請以詔旨刻諸石臣因記其事以彰德意之美以示後人之勿忘云白岩院記王十朋諾詎那居震旦東南山名鴈蕩最為造物所惜秘扵萬萬古而顯於本朝山中絕景皆廬於佛子開闢經營必其徒之有道力者驅龍蛇虎豹魑魅魍魎而有之權輿數椽侵尋萬柱如全了之菴于芙蓉今為能仁行亮谷于安禪今為靈岩文吉菴于碧霄今為靈峯是也山之內外招提無慮二十餘所問其經始與廢而復興無非有道力者山之東有嶺曰謝公世傳靈運好逰山而不知有鴈蕩䗶屐窮幽至此而返去嶺而北十五里有山曰白岩水曰仙溪去岩而北十五里有王子晉仙橋子晉遺跡在吾州者三一在永嘉二在樂清茲其一也院在白岩之下峯聳而竒水清而駛松竹蓊然而深信諾詎羅駐錫王子晉飛仙謝康樂登臨嘯詠之所是宜幽人逸士逃名晦跡修真學道者徜徉乎其間也院創于唐會昌四年至明年廢又明年復興初曰白岩院宋治平四年十月賜壽聖宣和三年燎于魔寇院僧元像閔之草創殿廬塑像貌以奉香火嵗久䆮壞僧子親慨然曰茲山吾祖潘氏所捨殿與像吾師所建也其可坐眡而隳之邪扵是紏同志募眾縁出力以成就之寳殿巍然輪奐翬飛觀者咸會歡喜讚嘆工未畢會傳教于邑之七寳雙峯二院其徒文表住是山遂卒其事而道塲為之一新嗚呼若子親真可謂具道力有功於其教矣是宜書勑賜靈岩寺額記鄭尚文通判按釋氏書有大阿羅漢與八百眷屬居南贍部洲自西教東流𠪱數百載人莫有知所者皇宋太平興國四年有僧行亮神昭因挈瓶荷錫共訪幽竒至溫州樂清之山門鄉見西有巨山穹崇巉崪瞻仰愕眙不能捨去即相與因溪水之源尋山足而入披榛冒灌行經七日遍覽周視疑入異域然古樹老蕂蔽虧天日林顛葉隙時見異峯貪竒極勝舊徑屢迷如是者浹辰得一巖宂稍可憇息乃旁詢耆老博咨鄉墅則曰是為鴈蕩山山頂有蕩不知其大小秋多鴻鴈飛集于上餘波洩注流為飛泉高自雲倪懸瀉數道以是名也傳聞故老中有龍湫亦莫窮其餘也亮昭二僧因卜棲止乃芟蘿導徑誅蕭剪薄丐米近村鳩工刊木闢塞發翳殫極勞苦逾年之後山無遁形岩穴之前地平如砥𢄙幅千步天設穹基頴峯秀巒環匝周列但見白猿金雀飛棲雲樹藻氣圓光冠映林嶺時即有新市居人樂安蔣光贊者貲産豐茂樂為勝事覩茲靈境首構梵剎曰亮與昭住持伊始後扵廣藏中得古禪月大師貫休嘗著羅漢讚文至第五諾詎羅尊者篇中有鴈蕩經行雲漠漠龍湫宴坐雨濛濛之句則是山也既名鴈山而龍湫在焉然後知南贍部洲羅漢所居即此山也至道中太宗時命中貴人裴愈采風吳會親訪靈跡屆此山中而以御書五十二軸賜之而去自是緇侶稍集今咸平中有僧正因抗表上聞以名為請翊日降勑賜額靈岩禪寺自太平興國己卯行亮神昭經始之厥後光贊正因修飾之中間神昭既逝行亮力募壇信增嚴佛乗塑像範鍾廓堂安眾門宇宏廠厨庫精密而光贊之子曰文濬嗣成先志捨錢百萬鼎新堂構至是凡四十年為屋百餘間費錢五百萬由是寺宇大僃東南為首稱焉鴈山十記始入鴈山觀石梁記五峯李孝光予家距鴈山五里近四方客遊者或舍止吾家吾嵗率三四至山中每一至常如遇故人萬里外秦定元年冬十一月予與客張子約陳叔夏復来他日従小筍用自愒晝為餱糧食給夕則舍頓牀敷恒衡于吾心而莫得縱於是盡屏去之獨從家僮兩持衾裯杖屨冬日妍燠黃葉布地客行望見山北口立石髧然如浮屠氏腰隆起若世之遊方僧自襆被者客輾然而笑時落日正射東南山山氣盡紫鳥相呼如歸人入宿石梁石梁拔起地上如大梯倚屋檐端檐下入空洞中可容千人地上石脚空嵌類腐木根檐端有小樹長尺許倒掛絕壁上葉着霜正紅始見謂是躑躅花絕可愛梁下有寺寺僧具煮茶醅酒客主俱醉月已沒白雲西来如流水風吹橡𣗖隋瓦上轉射岩下小屋從瓴中出擊地上積葉鏗鏜宛轉殆非世間金石音燈下相顧蒼然無語夜將半設兩榻對卧子約沾醉比曉猶呼其門生不知岩下宿也逰靈峯硐記自石梁南出五百步折而西行過謝公嶺嶺東居人多謝姓故名或曰地舊屬臨海郡謝靈運為臨海開山適至此人因以名之既渡縁澗南石路欲登觀羅漢洞於篁竹窺見水西大石壁下有谷若竪槖子約曰譆此或一竒也不可失呼家僮扶過澗入谷中見谷口石嶄然下垂如懸戶卷然中抱如壞壁坐其下而嘯如語甕盎中居頃有人語聲漸近則吾家弟思誠子撝與諸生也因皆屏從者從洞下入寺未至見道傍有石潭方丈而深莫可測仰視潭南上有山孤起如偃芝北上有山離立平地上如駢笋稍入始見兩大石相倚如合掌入天數千丈從合掌根入雨傍植石闌直上千歩乃至掌中望見出嶨中青天如懸一片冰旁設大士一羅漢十八設應真像懸崖上五百然皆為人縁取持去空遺土坐如燕巢栖崖上岩罅泉水下滴唧唧如秋雨鳴屋檐間令人大呼呼聲繞洞中不即出泉墜半未至於地為聲所軋則飄吹衣冠草木盡濕家僮戱馳石闌中脚頓道上石淵淵作鼓聲既下出家僮守槖者私自更守竊登之顧見主者皆已下即擊羅漢繩牀傍小鍾鍾聲奔谷中如鸞鳳行鳴半天上倚杖聽不可去憶吾兒時從先君子来列胡牀坐客洞隂令侍者先登雜吹笙簫擊懸鍾眾音縹緲鏗喤飄飄客新從他縣來或駭愕不敢上因大笑以為樂俛仰隔世凄然久之凡山寺僧皆為美名擬之若龍虎鳳凰麒麟蓮花芝草之屬皆不錄録尤勝者谷中恒有雲氣是日又欲雨山木黯然戶牗黝黑因呼守槖者持槖中筆硯就屋上亭修遊事所舍亭曰看不足盖取昔人山前向見白頭翁自道此山看不足者詩云暮入靈岩記出靈峯院偶坐澗水南客有言鴈山信多竒然豈復有過於此者予為言山之峭刻瑰詭莫若靈峰雄壯渾龎莫若靈岩峯言銳岩言大也余適小疲倚大樹坐甚恬客聞靈岩亟欲往即起促不得休前是一日行五里輒止舍是日會已暮頃刻馳十里到寺天正曛黑及階舉頭見巨石孤立如人俯月出正懸東南角星象纍纍下垂四傍客脅息不可上如游魚噞喁以身為浮游在灝氣上也入坐佛宮南階上正視見其面進升堂倚石夾室則旁晚其脇夜分又數數開南牗視之月欲墮未墮夜色如霜雪諸峯相向立儼然三四老翁衣冠而偶語獨西南一柱白而長身者也明日粥後由昌上人房下過澗得小石嶺可五六百步上觀所謂龍鼻水山半橫石作鱗甲状陷入石中獨見其脊從西南石峽中繞出數千丈勢盡乃垂入谷中作懸鼻疑是石髓積嵗月化為石故獨此鼻如瓠大乃紺碧膩滑異他石鼻端泉時時一下滴谷口澗西有立石長三千丈如卓筆曰卓筆峯峰傍流泉墮入澗中亦三十丈曰小龍湫稍西飛泉湧出石罅直上指尺許曰劒鋒泉寺以岩名岩又以佛宮北大石障獨高且大絕頂正平如塗丹堊是為平霞障諸峯皆牽聮在障傍其大石如樹旗居障左臂曰展旗其大柱居障右臂曰天柱龍鼻水又在障右脇間小龍湫卓筆峯劒鋒泉當居脇中靈岩二竒記僧言山有二竒其一由障左臂架棧道至旗半有石穴下窺穴中別有平土類人間土田一一具溝塍畎澮以小石下擊如轉鳴甕中其一由障右脇旁令人百計牽挽上懸崖上有石室室南有小徑沿徑兩旁皆麥門冬草如人手植路平熟數里若日有人来徃者絕端有窪石窪中泉冬煖如湯僧乃言昔有羅漢常浴是泉故石上有平偃迹石室則其愒息地也予與客相顧竊笑惡其言涉於恠然猶記之他日身至其地可一一推而知也豈真有隱者居之如木客之類宋英宗時有居人行湫水上見老父手弄藥一丸大如橡栗語曰爾為我持此獻天子忽復不見詣郡言狀郡驛上之天子遣中使持香来扵是鴈山名始在天下老父豈董五經之徒能先知云訪欽禪師過馬鞍嶺記夜宿天柱下寺水英二上人來坐與之語不悖其師者也頗能言欽禪師修浮屠氏之法居退讓之節知止足之義予久不見欽因二人者謝之兩客怪而問焉子平生名不喜其法而竊私其人胡謂也余謂客今眾子百家皆不能抗仲尼氏之道而異端獨遺其二焉曰佛與老而已矣為佛之說又有二焉曰大乘小乗乗猶言道也或為其大者或為其小者凢為果報禍福輪轉之說皆其道之所謂小者為其大者固已譏咲之所謂為其大者曰吾將以求吾心也吾將以見吾性也然恒過於中而弗趨扵常泥於體而不適扵用視儒者之有父子君臣大婦昆弟也輙訕而卑之然其處斯世也非儒之立則不能一息居也其訕而卑我者又其徒之不能盡其師之道者也彼有能盡其師之道常賴吾之有君臣父子夫婦昆弟也則不為強者之所𤄗貪者之所攘然後去之窮山大谷取其人之枯槁顦顇不適扵用而為世之所棄者以為之徒而教以其師之說舍茨而不以宮衣麻而不以絲食麥與菽而無以膏酩魚牲其言曰修吾法者其為宮室土田衣服膏酩無以異於人是自成其心也故其有宮室土田衣服膏酩則其徒之不肖悖其師之意假為禍福之說以勸愚民也今使周公孔子之居是也亦將修其禮樂政教以扶樹君臣父子夫婦之道而已彼枯槁顦顇不適於用為世之所棄去之窮山大谷以修其師之道則亦莫之制也今名為浮屠氏廢其法不用然而為儒者不能盡其道則亦何以異於是而欽獨善守其師之法而又其道之大者亦可尚矣扵是客咸願一見其為人去従院南登小山復折入西南過小溪百步許至栢菴問欽適往延恩院未歸惟有一僮居戶下遂南去谷口與持槖者會南過馬鞍嶺借宿山人家山人姓金氏大龍湫記大德七年秋八月予嘗従老先生来觀大龍湫苦雨積日夜是日大風起西北始見日出湫水方大入谷未到五里餘聞大聲轉出谷中従者心掉望見西北立石作人俯勢又如大楹行過二百步乃見更作股相倚立更進百數步又如樹大屏風而其顛谽谺猶蟹兩螯時一動摇行者兀兀不可入轉縁南山趾稍北回視如樹圭又折而入東崦則仰見大水從上墮地不掛着四壁或盤桓久不下忽迸落如震霆東崖趾有諾詎那菴相去五六步山風橫射水飛人走入菴避餘沫迸入屋猶如暴雨至水下擣大潭轟然萬人鼓也人相持語但見口張不聞作聲則相顧大笑先生曰壯哉吾行天下未見如此𤄗布也後予一歲或一至至常以九月十月則皆不縮不能如向所見今年冬又大旱客入到菴外石矼上漸聞有水聲乃縁石矼下出亂石間始見𤄗布垂勃勃如蒼烟乍小乍大鳴漸壯急水落潭上窪石石被激射反紅如丹砂石間無秋毫土氣産木宜瘠黑反碧滑如翠羽鳧毛潭中有斑魚廿餘頭聞轉石聲洋洋逺去間暇回緩如避世士然家童方置大瓶石旁仰接𤄗水水忽舞向人又益壯一倍不可復得瓶乃解衣脫帽着石上相持扼掔欲爭取之因大呼笑西南石壁上黃猿數十聞呼聲皆自驚擾挽崖端偃木牽連下窺人而啼縱觀久之行出瑞鹿院前今為瑞鹿寺日已入蒼林積葉前行人迷不得路獨見明月宛宛如故人老先生謂南山公也宿能仁寺東菴記鴈山西南一峯絕高下視眾大山猶當是大父行舟行南海月餘長望見直西北有物如高髻亂髮纔一握大倚為指南又其上常有雲氣居人不呼某山而呼曰常雲傍出二里有能仁院院亦名常雲予與客從大龍湫出欲宿院中度已夜遂從山人家宿遲明浩上人聞吾當至山中來迎舍東菴菴行公營以歸老歿今三年其徒義上人秀上人居之設粥茗酒醴且止予宿日正亭午猶可去忻然許之遂弛擔焉是行也察於為佛者得三人焉欽能盡其道者也秀與義能不悖其師之道者也因記之遊惠上人開西谷記靈峯去靈岩十里而近中路有亭名翠微旁傍夾樹兩垣路從垣間出過澗行繞北山麓折而南南有深谷梁石過之復折而西入谷中始見石林如犬牙岩下佛寺曰淨眀過兵焚其廬獨遺壞屋數楹殘僧喜閉門而不迎客徃徃過者不須知有寺予久欲遊而不得其閒是日至自常雲將入門僧復拒戶不聽客入即呼溪南居媼隔戶語僧云是遊山人乃拔去拒門木入弛擔為午炊吾兒及諸生疲極皆小偃休陳甥腹痛自煑藥家僮炊未熟予將子約出南戶徘徊徃来望屋上山山圍屋如城府或纍纍然如蜂脾綴下而刳其中滛滛然如燕巢斜而剖其戶顄者窊者仰者歕歕者羃者訛者傴者喙者掉者俛而窺者騰而上者如人皆具耳目口鼻而無一相似意此中當有大佳處耳更着屐從屋窻中出上屋上山行二十步復得石橋過澗去子約持杖擊草又得石壇數方皆古人作亭遺趾壇為階二三級或五六級壇相距雖皆四五步每一壇上輙見山如人腹脇背尻向背一一不同復益上數步草中尋見石階八九轉一轉皆六七級兩傍夾大石壁如行巷中仰頭見青天如曲池中緑水止而不波泉滴兩崖間如雪消作水建瓴下注谷中大石上忽憶先子言淨明維摩石室旁有西谷是惠上人所開絕佳當是此地耳今寺僧乃畏人知更作屋因相遮以故從窻中出不爾不見此竒特書之庶無為僧所欺惠字柳下工為五言詩云鴈名山記容問山以鴈名胡謂也予為言長老相傳絕頂上有大湖冬春鴈過入南海常棲止其中居人以為名湖水墮入澗流谷口為大龍湫湖傍有比丘尼塔寺一夕沉湖中至今五百餘然猶餘遺地敗址棠梨花數十百株皆儼然成行列土絕膏肥種蹲𩿍大如斗長老又言湖水漸游為葑田嵗月浸久彼湖皆化為腴土十年前有僧来乞食因言吾去前年去鴈湖傍依大樹縛屋種菜菔菜蹲鴟以為餱糧獨無所棲願乞金錢作屋予聞之欣然止其宿問道路何從入僧具言去従靈雲寺南入山時時過絕險挽牽懸藤偃木以過日初出時上山日正中僅可到山顛望見永嘉城下大江如牽一線白東面海氣蒼蒼如夜色山上無膏燭地爐中燒木葉葦竹山鼠来與人相向坐如狐狸大無屋不可居也予愛其言久欲登之度持二日糧乃足又向乞食僧已去無復茇舍釜竈賫具當用肉糒糗𪍑雜器之屬不果徃五六年年嘗一至靈雲寺觀所從入路因徃至梅雨潭潭上𤄗水懸空數十丈谷中風起水吹着人常濛濛如四五月間霧雨亦一竒也旁有隣寺三四區曰古塔寳冠羅漢石門又有一寺在南山冢與常雲相望路絕高曰飛泉種種自作面勢皆可遊獨不大爾秋遊鴈蕩記北從天台来入古東甌郡境上望見西南有山相向立如兩浮屠遊者咸曰此鴈山門戶也益深入其阻視羅漢洞東西天柱大龍湫猶人有眉目十八寺皆其肺腑也僧言其祖自開鴈山為諾詎羅詎羅去遊方時師懸語之曰若行四方當值勝妙山水起塔立寺花名村鳥名山則其地也詎羅適行至山下問田間老父父所居云何父曰芙蓉村又問山云何曰鴈山詎羅曰是吾師所語我者吾於此乎老矣入過四十九盤結屋谷底面湫水以居既沒其徒弟子為立塔廟是十八寺之萌芽也詎羅首所開正得其肺腑今人言春逰天台秋逰鴈蕩此非言地勢便利其時獨可遊耳鴈山無土田桑棗兩山束澗水人行盡日曲折在水中又多篁竹草長沒人春夏十日九霧雨後行人不見前行人時時遙相語又馬蜞毒物善囓人縁木葉草末風動即着人出血數升獨秋冬時草木黃落毒虫盡去乃可入至數百里山皆在目中無秋毫蔽遮然患遊者匆匆絕佳地恒逺在深谷中不盡見也古人云緊絆芒鞋行一月彷彿見得皮膚耳非過言也呂夷簡焦伯强劉器之王龜齡皆嘗為大官而能留連山谷中盡發其勝豈古人用此為陶寫地耶然名為逰者眾矣壁間姓名一一為狐狸貒貉啗盡獨此三四人者至今凜然有生氣何耶其草多寒凉藥可用治疽瘍滯下其木多杉檜豫章其獸多猴狙豕而無虎其虫無蚋蚊而有馬蜞蜞善囓人以燒竹葉塗創血立止其居人不為稼穡皆取給衣食於僧云逰石梁記陳德永是晚至石梁遂宿梁外小寺梁拔起地上百餘丈穹窿懸跨隔林竹望之如白虹下飲背有石類菖蒲伏岌岌欲堕怪藤數十聮絡之隱然如脉筋露出人腠理內有大石側剖高出梁背空中深窈可容千人日氣従梁口入潛泉偃行罅間滴滴如甕盎中響地上皆碧滑隂冷切人不可久居稍出至梁下低回仰視有小紅樹長尺許倒粘絕壁上意甚閒逺悠然不去者久之遂賦石梁詩云國朝逰散水岩記黃綰人皆知龍湫之勝而不知有散水岩遊散水嵓自蕩隂章氏之居行二十里餘崖谷壁立拔地數千尺懸𤄗自崖端垂下直擣澄潭若白虹橫空匹練孤懸照耀于丹屏翠壑喬松古柏間觀者莫不心駭神眩余從瀑下援葛上崖半坐洞穴中視瀑水如明珠纈箔當戶窺見旭日曈曨祥烟繚繞妙不可言又従崖半行過東南隅有石天窻儼似樓閣闌檻上有梁石橫若楣宇憑檻而眺竒嵐疊障皆可攬有故記以補鴈山之遺逰鴈山記甌台之會樂清北鄙有鴈山先是達人咸傳其竒勝甲天下而豪士以地僻莫能暢其登賞之趣為恨嵗己亥傅子應臺約再遊而弗果殷子虚川竟阻以雨是冬余按温將如台樂清朱君蕩南有宿約申以兵憲胡君有恒之請余乃勃不可已乘興而遊度窰奧嶺觀海崖見蒼翠層巒如烟升滄茫中羣山奔海若伏若起或斷或續海舟飛蓬而漁澹日隱見扵海島間攀四十九盤嶺抵能仁寺羣峯呈竒應接不暇如火之炎上曰火焰峯霞蒼雜沓千朶上指聳峭莫攀曰芙蓉峯懸崖墜石空通碧膩伏牛嘶虎驅馬盤龍又不可而殫述也是日風大作晚宿能仁公署夜聞飛灑聲將曉呼詢従者曰晚来有雨開戶視之則皎日光霽乃知泉流澗中風葉飛鳴山境𡨜靜誤聽為雨聲也朱君曰外谷有梅雨岩達官罕至余乃呼僧為道出谷縁小迳冒荊茆壘石間五里許有石巍然削翌有低昂勢如劒戟狀曰卓刀峯入谷有雙石壁峙中含圓石曰含珠峯傍有小峯如剪刀然左右羣峯如雲升日暎彩霞流色詢其山人亦莫可名狀也低岩削壁千尺流泉峽石間飛灑如雨飄流不定或海風狂擊泉忽出谷八九里間入村落宛如梅雨由外谷度小嶺見石門寺廢基又削崖中有羅漢洞險莫可攀山入云石閩飛米或未然云縁東谷觀大龍湫有峯如祥雲縹緲萬丈巉岏曰常雲峰峯半有洞曰道松或云道松修鍊之所峯下有瑞鹿寺遺跡又有小洞葉或時自洞出居人候之則明大風作矣沿澗有巨石壁立萬仞形若剪刀又直視之則天柱也谷底錦崖萬丈彩嶂千圍泉飛崖上絕不霑壁随風飛灑如白龍騰舞或激亂石或洒碧潭或谷風逐起久而不下倐忽飄洒餘沫向人衣帽皆濕或谷日暎崖如飛虹飲澗流金眩目縁谷立崖下如飛雪流沫擊以金鼓之聲則飄飛萬狀乍盛乍細乍逺乍近極其盛時則轟然雷驚如萬人鼓也崖半白煙飛升騰布谷中仰觀雲飛若崖有奔動勢近崖有潭潭畔亂石磊落石上有題杜審言来此字對泉橫崖應臺子作亭其上崖下有庵以止遊人出谷回視剪刀峯又巍然雙峯也朱君曰大龍湫之上余嘗扳險而登有碧潭淵澄莫敢俯視五臺二僧結屋其上崖上懸流百尺潭中有龍故曰龍湫龍湫之上有蕩湖鴻鴈飲濯其中故曰鴈山云出谷謁鴈山鄉賢祠朱君每逰率止於兹先是山人為予至闢除有斑虎出澗中老叟擊之而斃朱君為殺虎辭以紀之晚酌於能仁桂酒醃菜意味悠如敘往陳今朱君甚甘之余亦不知宦遊茲地也明日度馬鞍嶺躋巔見羣峯紅綵流霞如萬架樓臺峙者壁立巉岏若墜有曰版障嵓又曰觀音巖蒼巖突兀有奔趨狀倐忽驚訝如獅獸率舞出西谷遊靈巖寺始入谷口左峯如獅右峯如虎虎峯之中有洞遊人莫之至乃令架棧道而登中可容客座崖上有泉下滴縁谷望高峯上有石如僧作拜狀又一石如几抵寺中坐列屏崖突兀彩色雜蒼欞櫳壁立如千層樓閣曰屏霞嶂嶂之半崖曲折而登有龍鼻水巍合二巖石龍中陷有鱗甲状垂端扵巖中若鼻然色如古銅圓尖有孔泉水時時下滴飲之寒毛骨可治醫目嶂左畔崖有安禪谷谷中泉出入池創寺定基於此左前崖有展旗峯如大將出師有飛動勢峯後有峯如屏石有萬丈圓峯壁立不縁諸峯曰天柱儼然端人正士正色立朝能寒奸邪心令人肅然起敬天柱之後有雙峯作飛舞之勢曰雙鸞又小峯插天曰卓筆旁有一峯瘦削無依宛然清風可掬曰獨秀又飛彎如髻曰玉女峯又其懷竒呈恠蒼彩森然莫可名状也晚宿寺中胡君曰鴈山之勝莫如靈嵓願尋勝以壯兹遊明日乃縁亂石中尋小龍湫有巖腹如珊瑚馬瑙色懸崖環峙高大龍湫崖石之半而谷之廣亦只三之一泉飛崖上觸石騰烟如霧團結旋而流轉飛灑霑人乍巨乍細亦無定踪也潭外有大石橫卧有常寳臣黃伯起来鄭公文會處字使人洗滌莓蘚百計臨之而後可辯也又一大石橫覆扵旁泉崖之下有石突如金字狀泉流分布石苔嵗久積成琥珀玻璃之色潭上有三石而上一石方平可坐余乃近嵓坐石上而朱君従之諸君相繼登焉觀飛霧轉旋碧潭時有兩狀則尤竒也僧云距此五里許有泉上指如劍鋒狀惜未之見也朱君曰展旗之半有天聰洞棘莽峻絕不可攀余乃令驛卒闢除治道使人翼之而登將半有磚石舊路有石題黃伯起字躡險力升其高空通百尺最上有石級飛挽而升中有限若閾光自下生其中深不可測削壁以石投之聲堕許時倚限觀洞外有二孔故曰天聰余意朱君莫能従也然猶攀歎美者久之自以生七十八年今始見為不負也胡君軰則阻險而莫能升焉縁展旗外谷見其崖石竒特詢之僧人云有鍋洞無路可入蔽之以百尺高岡而莫可見余興不可已乃令人闢除力挽登高岡望之見其崖石削立圓摶缺若門上有石若盖下有圓池若鍋壁內突石狀如鍋面崖泉墜地飛騰而出若烹餁然朱君繼余而登諸君竟莫之従也寺前巖石中有圓石曰含珠嵓圓覆而頂平曰果盒巖竒形恠狀雖終年遊覽亦不勝辯也寺中諸峯皆空虛夜靜人言犬吠鐘鼓聲咸傳應谷外宛然蓬莱洞天不復知有人間矣明日出谷縁澗而北見淨明寺基有新月洞水簾谷石亦竒峭蒼碧視靈巖諸峯則不及矣去五里巖上有峯如將軍披掛状又石如觀音坐禪他如屏霞錦帳欞櫳崆峒往往而是志亦莫之紀也過響嵓人呼則應言則傳雖多亦不貴也縁南崖有小𤄗布峯亦竒峭澗北而嵓如覆簷然廣十丈深半之石皆蒼霞色澗有潭方丈淵澄莫測曰照膽潭潭北有峯如靈芝南有二小峯直竪踰崖有廢寺基登靈峯洞千仞兩峯合掌直竪中虛巉紫視之一片碧水臺上有觀音羅漢以石為之亦有擊之而作罄聲者臺中以足擊之若鼓然廣十尺深倍之左有泉流方池後有泉自壁出前有泉滴如珠簾六月不知有暑而冬亦不有寒洞雖石而泉通地脉發舒故遊人得以自適也鴈山之洞此其傑出者與對洞有峯攢簇曰五老臺其他谷諸峯望之秀異惜未能遍索幽竒也度謝公嶺或云靈運開山至此故名登石梁寺有巍石空虛橫架如梁石縁後巖中深二十餘丈廣半之僧居巖中出石梁二里許有石巍立如老僧披袈裟状旁有小圓石聚立如羣僧卧於其側出此則無竒矣抵嶺店驛風復大作晚宿驛中夢清氣定猶若止靈嵓故處也曉別朱君而去嗟夫羲軒察輿立象盡變堯舜效寧垂衣神化是以下襲水土上登泰山觀逝者之如斯在山澤之納污非夫仁知合一動靜不違敦化川流各極其趣其孰能與扵斯下逮哲人輕名薄世志在麓泉沂水春風心無霑滯故能探竒索幽玩清采華為洗心垢用培元神以暢羣動然則輿勝之澤不亦銳乎況夫鴈山東甌奧區越壤殊觀晦跡峻嶺輝動海隅磅礴廣逺神斧無跡飛泉殊趣恠石萬態千峯爭竒百洞異麗足以媚高人而賞豪士雖古人名筆亦莫能模擬其蘊雖㒒夫臺史亦知佳尚戀慕近取之而各足逺取之而莫窮取物察則不為仁知之一助耶余愧不文無以揚鴈山之秘姑述見聞以俟仁知之探討且以發嗣遊達士之逸興云是行也於時為嘉靖己亥冬十月二十日入谷二十五日出谷天朗氣清山靈若安余之遊者同行為憲副盧君蕙胡君有恒都閫韓君平致仕吉安太守朱君諫予與歙人清軍御史王獻芝也鴈蕩山重建靈巗佛殿記戴洵祭酒號愚齋四明奉化人余性嗜山水遇佳處必遊既遊必圖之萬暦丙戌春聞永嘉鴈蕩山絕竒杖策徃遊而廵撫撫中丞三原溫公純行部遆至余同年也遂相從入山午飯靈巗中敝屋三間不蔽風雨余觀靈巗真竒絕雖善畫者不能圖而荒廢若此為之慨然僧圎魁者金陵人遊方来住此十數年矣語余靈巗舊有寺殿宇且百餘問入國朝始漸圮而今盡矣因請為興復余曰此大勢力事而以望鯫生耶一笑而別既歸意未嘗不在靈巖中也居無何圓魁復徒步踵門来請益堅余嘉其苦心劲志而無以為計乃為作二書一與中丞溫公一與尚書平湖陸公光祖請為檀越圓魁欣然持以徃僅數月来曰二公已各捐百數十金致之樂清矣余又為作一書與樂清尹漳浦吳君華託為護持而吳君最善營度仲春舉事迄仲夏而殿宇成圓魁偶掘地得古碑榻墨本持来請余為記余視榻本漶漫難識夜以燈映之始可讀乃宋史丞相彌逺與壽昌長老若容徃還書也盖靈巗舊為壽昌禪寺以供億不支降為教院及若容住持靈巗而又請復禪頟丞相手書之則靈巗異時之盛可徵也夫山川遊覽若無關理道而臺囿池沼卷阿飄風著在大雅即聖王不廢何耶盖宴坐室中則神觀擁塞惟登高望逺探詭搜竒則浮沉起伏之端剛柔夷險之故可以開發性靈恢弘智識而况剖符之吏乘傳之使困頓於簿書期會之間疲薾於車塵馬足之下偶得高明者而一遊息焉又可以洗滌煩襟疏通滯氣盖一張一弛交相為濟而後神益清慮益精政理益成也故竊謂靈巗有寺未必不可以助流玉澤也若乃佛理尚空不著色相而名區勝境皆佛宇居之雖其間不無興廢而迄未有久廢不興者將非色不異空而空不異色固天地間妙理本然雖英君誼辟有不能易者耶考圖記鴈山開自諾詎羅而詎羅本蜀青神人乃身至天竺受業釋迦為十六阿羅漢之一已乃復返青神之中巖開剏道塲晚来鴈蕩終焉此其身所涉歷極地東西殆數萬里足迹遍於宇內將非真所謂飛行變化住壽命動天地者耶故詎羅之名與鴈蕩無窮而史丞相去今僅三百餘年人無道者此亦空即色而色即空之一騐也故觀於靈巗者雖未必其於真空妙諦何如而名利之心可使都盡故又竊謂靈巗有寺未必不可以翊扶世教也然則靈巗佛殿雖廢於昔而復建於今不亦宜哉而近世論者又或謂供億病民至比鴈山為尤物則若惟恐寺之不廢者是又不然方寺之盛也僧眾實繁供億全出於僧故僧不能給而舍業以逃於是始全仰於民每一上官至筵几帷帳張設之具皆移自數十里外黃巖樂清二邑之民奔走趨事常百數十人數日而未已假若殿宇修復稍還寺産使僧得具其器用而民止供其糗粮豈不僧民俱便而賔至有歸也哉而於鴈山乎何尤盖中丞温公與尚書陸公其仕素精於職業而其學尤明於本性故其曠懷達見超出俗情能不惜重貲而吳君又善體二公之意以身肩之遂速成若此顧余一無為力而徒以區區筆墨從事其間且為山靈所笑乃圓魁必欲得余為記相守五閱月不去亦足占其有定力者不可虚其請也乃強為述二公之意與吳君之勤以授之俾勒諸石不知後之觀者視史丞相若容僧何如也縣丞李貴齡主簿胡典史萬和亦分任督理者因併書焉耆民蔡攀如千人皆尚義助後者則例刻於碑隂遊鴈宕山記鄭汝璧號崑巖縉雲人都御史環淅多名山而竒瑰首穪鴈宕云余家玄都祈僊二十九洞天中靈區故相接也而寄之寤寐者逾三十年萬暦戊戌余既幸襄尊人事將為五嶽游則以兹山始夏五月望前一日偕永嘉何山人无咎陳茂才納之發棹江心順流舘頭驛入于河夜投樂清縣宿焉時天雨邑令萬安張君孟珍留酌西塔院信宿而雨不休眾虞為遊妬廼余興勃勃不可已且念山靈稔余必有得天時者遂决筴徃詰朝忽霽御筍輿度白沙嶺嶺頭望海海天無際漁舟點點如千葉飛浮心目為豁午餉窰嶴驛上四十九盤睇大小芙蓉朵朶樸眉睫間晚宿能仁寺寺前峰焰如火寺左風落枕如雨蚤起與老僧明海譚半餉步入東谷里許望剪刀峰稜稜千丈上成兩岐雲霞當岐遇之真如剪綺再入水聲潺湲轉聴轉震耳則大龍湫也源自湫頂鴈湖千頃來下注萬仞日貫之成虹風飄成金皷譟之成暴雨驚雲有無變幻儵忽萬端余所見則霽霏如白玉煙又如千萬白羽箭飛墜罡颷中不眠飛瀑之最竒絕者已東為諾詎亭尊者自西域來觀瀑示寂而晴上視後有僧喝潭下水同何當仰矚遂暝對此泠然無住豈直前人所稱看不足耶亭午度馬鞍嶺一峰葱菁摩天如大士𡋐蓮臺發紫金光時雲氣吞吐余至忽開朗俄而黝然二君乃不得暏余笑謂阿閦一現不再現固自夙縁爾下嶺歷西谷抵靈巗寺靈巗寺者鴈山中眀庭也東西谷分兩戒東峰五十有三谷西四十有八稱百一峰寺當其中扃初入白雲鐵板諸崖障之鉢盂峰綰其口紆盤數百武厪通箭栝至則屏霞嶂障其後如負扆然左峰之橫曳而似蝥孤者為展旗㟏岈而似累貝者為紺珠崒嵂而似張幄者為石屏右峰之峭矗雲表而擎天者為天柱儷立柱側而飛翔者為㕠鸞銳而端者為卓筆嬋而嫵者為玉女子而梃者為𤢜秀分行呵擁若八公之侍帝列宿之麗天誠僊靈一大窟宅也它若屏霞嶂右方之竅頑石而洞鱗鬣夭矯懸鼻如匏滴石髓而甘者為龍鼻水寺西南之當几聳立衣項䄡如望西方而禮拜者為僧拜石則鬼工之巧斵以駭逰目供絕倒者爾勝顧不以此是夕宿寺中與二居劇譚方之外何君別號丹霞余謂此丹基福地君苐構飡霞閣于上方之中央揖群靈而餌大藥便當僊去余且躡而後何用齷齪人間世與佩五嶽圗冥𢯱逺討為哉何君唯唯𣸪為余言水簾谷之勝遊人罕至余乃賈勇前見層巒簇簇如蓮花瓣淨眀寺址在其下而顧無名余目以蓮臺稍進則兩崕夾如鐡壁青天一道如匹練空懸崕際飛泉霂霡濕人衣裾崖下洞如新月玉乳盡作雲霞状亦一竒也出谷遇一石人側耳山名聽詩叟恨不槜謝𥆮驚人句使聞之已過響巗大呼聲震林樾與前部皷吹相答縁澗行可五六里至靈峰寺則又幻為一局矣群峰排插兩道周如幢盖迎客其竒而名者曰靈芝曰翔鸞曰五老五老不甚肖而靈峰一洞則大竒盤數百級而上上合如掌而成屋擔檐前受日月光朗可憇去中漏始青天一片似玉壼氷巗鏬泉聲應人呼嘯若甕盎中鳴唑酌張令君所移酒歌高山而出踰謝公嶺相傳靈運開山至此然既經謝屐那得一亡所經營故知謝公至斤竹嶺止爾其東石梁在焉欹石如槁木倚崕端洞其下入可唑百人稍入為層臺楹而不椽月竇風牕亦自足翫度所不及天台者非得水怒號作雨聲爾自此散為平隩唯谷口老僧巗絕似祝髮曇瞿襆被逰方㫄后纍纍如二三闍黎附耳而談經柰何當孔道間鎮日管送迎良苦矣石梁無可棲止亟走宿嶺店郵亭眀日取道海壖而還夫以鴈宕鉅麗之觀前人謂褁糧經行一月出山未可誇人余徃以旬日何論窮𢯱即意所至湖若鴈頂谷若安禪潭若梅雨應接猶然未暇安所稱遊哉然以靈巗之邃焉而竒龍湫之幻焉而竒靈峰洞之皚磊焉而竒皆落吾目而神與之遇又記稱秋逰鴈宕直以春夏苦霧雨故乃余来自五月行遇雨而登眺則霽夕遇雨而朝發則霽山靈若余齬者初地佛子五十三叅要以取次入元李孝光言率三四至山中每一至如遇故人萬里外余此逰為初地小叅繼而源源來則故人萬里握晤山靈顧不當更相賞乎哉鄭子曰九州五嶽盖余游其四云中嵩黃盖高不數百丈東岱高而延袤不百里西華三峰如掌恒石如砥非奄有川澤之竒也而秩望以嶽稱尊焉它若環瑋竒絕如鴈宕諸山或不得望登封之末盱又或久而後聞則何以故先王畫野建邦類表大山以為鎮示民不迷辟之方嶽偉人鎮物承天寸雲敷澤輙尊而禮之以為民望貴其用也乾坤之氣欝而不洩則結而為名山大川動數百里與七曜爭竒或砥狂瀾而障之海嶔嶇廖廓使人企而慕而足跡卒未易攀有若畸人節士屹立波靡而韜光深谷以名繫宇宙之重輕則不用者貴耳鴈宕將母類是夫五嶽登秩太和晚出而踞其上鴈宕即聞自近世而名馳寰中為竒棎之士所傾慕不啻五嶽盖理貴𣇋成不𤢜山川然哉令君名子珵山人名白茂才名九陛記者余縉雲谷潭逸客鄭汝璧也逰雁蕩記林汝詔號光璧叅議莆田人雁蕩為海内竒勝以僻于浙之東南嘗槩慕不得見者若干年萬暦己亥秌余以少叅視事浙土例當一謁直指君惟時直指在東甌則雁宕其境內也東甌去浙逺然其間地僻民醇城市清楚人好修餙引水為池植竹為林若城中之華盖峯城外之江心寺盖別一洞天云由府四十里至館頭驛五十里至樂清縣又五十里至窑奧驛有嶺極峻登高而望見群山赴海或起或伏水碧蒼蒼漁舟漂渺俯聎愕眙令人不能舍去過此為四十九盤嶺凡四十九折而至絕頂亦望見海嶺左有将軍石如將軍戎粧掛劍不數武為能仁寺前有對仁峯右有火焰峯産方竹無尾相以祖師得道放生故至今右有鍋大可容百餘石豈當唐宋以前未經兵燹緇侶眾集而鼎食者耶或以熖峯相逼取水火尅伏之說亦似可信然本寺未嘗不煨於火者過行春橋三里許懸崖之窩為飛来羅漢塑像甚真相傳以来自閩之漳越海入山逢樵者化為石前有七級浮屠轉折為寳冠峯高聳形如冠因以為名下有寳冠寺羅漢寺今俱廢矣越海循溪有瑞鹿寺有祥雲峯寺亦廢層巒疊嶂直至龍湫皆一石連亘故亦號連雲嶂左半崖有閻王鼻右有風洞呼嘯則風至有剪刀峰亭亭插天正視如剪側視如天柱對靣則大龍湫在焉懸崖萬仞一水直瀉若匹練垂空若玉柱插漢非烟非霧如虹如霓旱亦長流潦不驟長流不附石洒如輕絲瀑下如雷日射五色以鑼皷聲之則盛瀑飛舞变熊不可名状上有龍潭下有萬仞深淵相傳有神物蠖藏其中大旱土人就此祈雨每禱輙應湫之前為詎那觀瀑臺上有不足亭取古人一生觀不足之意余與吳郡筆山公同遊其上因其口佔偶續一律云誰開巒嶂透翠微萬仞一泓古今稀素練垂空銀漢落靈珠凝霧玉龍飛瀑聲若護風雲色集霰堪裁霓羽衣最喜日光来五彩相看亭側已忘歸背有白雲庵五臺僧所結上即雁湖方可十里水常不涸飲濯其中故以名洞過馬鞍嶺遙望左側有石門兩崖屹立如門僧言其內有巨浸産金鯉門側有龍井仰口如瓶居人嘗夜見赤光焉有觀音岩普門玉柱等寺廢址僅存折而西有靈岩寺昔廢廵撫一齋公檄樂清尹吳君華者捐俸鼎搆䂓制亦宏廠可觀左有展旗峯頂珠峰蟾蜍峰後有霞屏障高廣數百丈環列如屏色如塗丹堊温泉石室在其上龕內為龍鼻水石磴盤折而上可數百步深十餘丈四圍石壁色紫中嵌橫石作鱗介状從下視之見其脊隆然外露宛若龍形盡處作懸鼻滴水清洌可祛眼疾附洞有㕠鸞峯卓筆峰玉女峰劍峰有小龍湫比大湫高可三分之一寺右為天柱峰峭直雲表如人翼又巖立不减剪刀峯云有僧抱石若僧靣壁以坐古人所謂坐定幾時還出定不知窠燕污袈裟者有鉢盂峰㕠筍峰即神龍聽法之所有寺今廢隨溪數里許有響岩人呼則應鼓吹則聲震谷中所歷岩岫竒峭不可名識即僧亦不盡識云前望謝公嶺即靈運蠟屐處也縁澗有巨石列幛如屏下有小洞洞口有斷橋下有照膽潭方丈淵澄莫測不里許是為靈峰寺前有靈芝峯宛如紫芝擎天又如老僧頂帽以坐雖鬼工雕斵筏以加矣左有獨秀峰從溪中凌凌立起右有五老峰連亘高聳若斷若連後有靈峰洞即羅漢洞两石夾峙如人合掌入天數千仞中竅一門深百丈內如廣厦明塏秀絕躡危磴至寬平處有大士像傍列十八羅漢相傳以洞內昔皆亂石湫隰有劉姓者貲砌臺塑像其中又賣二女以補不足夫賣女結縁與捨身奉佛何異然碑刻不載豈傳訛耶洞左有泉下滴唧唧如檐間秋雨聲下有方池前有瀑如珠夏不暑冬不寒雁山之洞此其傑出者洞口有㕠笋峰高插如笋尋舊路通謝公嶺有石梁洞洞口一石如梁穹窿橫跨不可仰攀內有大士像亦設十八羅漢右一池清冽可愛則石隨所注有比丘自稱住此三十年矣叩其禪宗似不甚通曉余惜其久而未覺也為之憮然出洞有老僧岩竒峭可愛逺望之如老僧對石近則如披裟前行傍有二三闍黎若附耳譚經然其高百仞再十里是為嶺店驛盖余就足跡所履歷耳目所覩記者如此良亦勝遊矣其他掛漏不計也說者以寺剎昔稱盛今滿目斷礎遺墟僧亦厭客尋幽探竒留連為已累乃隱諸名勝不以告客以為僧病又以使轍頻煩供億靡費令百姓奔走絕命相與疾視厥山為尤物以為山病夫病僧則尤人病山則尤天愚以為乾坤既奠洪荒既闢其間峙者為山流者為川大塊設竒天地何心豈易剝之數盛者必衰衰者復盛勢若循環籍三百年輪廻之後安知廢寺不再興耶是尤扵天者固非而尤扵人者亦非獨恠吾軰受君之祿享民之奉忘國卹而逐世娱至令百姓廢耕桑治道牽馬縣官供粻恐後民睊睊視此心為尤物如樸溪潘氏所云也則吾軰大非矣予因登覽之睱不能無慨于中于是作鴈蕩記是遊也同行者大叅茟山劉公則己亥之六月念一日鴈山志後跋余不肖樸遫闇淺承乏樂成域中有雁蕩諸山之勝諸貴人逸士驅車挾策所經遊者靡不嘖嘖稱竒絕云不肖素聞其槩至邑累月曾弗一徃非惟不暇亦有所不敢也迨司理胡公以鹺臺之命查盤蒞下邑始得從登此山裴徊焉嗣以二院經臨一舟至其地亦弗睱一觀也公餘稍取山志繙閱彼其巖洞泉谷寺剎景物花草禽魚與夫記傳詩賦之類盖井然煥然稱大備哉昔人謂天下之治亂于洛陽洛陽之盛衰于園囿自宋至國朝鴈山之盛衰屡方秀野草堂顧氏藏書印
