body:
  text: 詩五言絕句宋能仁賜額王十朋號梅溪宋状元不到能仁久欣聞賜額還浮雲已過眼依舊好青山國朝望鴈山黃綰尚書黃岩人號久庵盤領秋烟外亂峯霄漢邊遙知湖水曲留我釣魚船羅漢洞張池台州人空山留幻跡天壁立高臺海闊月初上水流花正開石梁韋啇臣叅政嘉興人巖際石梁橫嵓中石髓溜我来秋氣涼天光滿幽竇龍湫吳玄會號五松應天判樂清人白日飛寒練青天下玉虹誰將廬阜境移入鴈山中憶山侯一元號二谷布政樂清人黽勉辭名山數日仍在眼遙羨山中人初不出戶限度謝公嶺蔣國輔登登縁澗嶺謝守昔年開欲賦懷賢調慙無一斗才照膽潭簫廩號隅侍郎江西萬安人紺碧一泓水淪漣百尺潭洗心居已靜照膽自生寒靈峰洞懸燈入靈岩中有應真跡五老列蒼屏似與開雲笈仙人橋一片敝虛眀渾淪無點涴誰將神斧開却駕飛雲過響巗峭璧倚天開空谷貯清響不信少文琴能徹鈞天上展旗峰龍旗掣海雲誓掃三韓宅席捲向名山早已来重譯天柱峰一柱自亭亭四壁渾無倚莫咲麄頑姿天地期終始獨秀峰拔地起孤根插天成獨秀𠜍頂金石姿未許洿靈鷲玉女峰玉女竚靈山含睇在遐舉許汝駕雙鸞更莫行雲雨龍鼻水龍在天地間存神還廢耳任鑿一竅開混沌何曾死剪刀峰天孫有抒軸雲漢羲昭宣吾欲施裁剪還歸象帝先度馬鞍嶺捫蘿陟崔嵬列屏開石室中即上世人彷彿曾相識大龍湫誰信一勺水而能藏蛟龍有時驚人語飛瀑滿晴空宿能仁寺竟日行雲霧薄暮倚新晴自咲車前雨催耕更洗兵早行鴈山藍輿初入谷拂面雨聲來任汝吹多少吾心豈易囬老僧岩老僧面壁觀車馬紛來徃心景了不關莫更加清賞石梁洞昔年來古洞雨急興先闌此日非前度心空境自閒七言絕句宋過靈岩寺呂夷簡淨名菴下靈巖路峻壁層崖倚半空最愛老僧年八十一生長住翠微中過鴈山王梅溪三宿山中始出山出山心尚在山間浮名奪我林泉趣不及高僧一味閒又清秋天氣過山中征鴈行人路不同從此又勞千里翼傳書来往浙江東過靈岩二首家在梅溪水竹間穿雲䗶屐可曾閒鴈山新入春逰眼却笑平生未見山洞中大士半千身住世端能了世因應笑玉簫臺下客馬蹄長踏利名塵過靈峯三宿靈峯不為禪茶甌随分結僧縁明朝杖屨丹丘去帶得烟霞過海船龍鼻水石梁雙合夾蜿蜒中有飛来萬斛泉一竅涓涓通海眼時興雲雨擁高禪過淨名二首淨名却見老維摩謂長老顔公道眼相看語不多待我衣冠掛神武杖藜来此老巖阿谷中有月露蛾眉新月洞水織珠簾更絕竒水簾谷滿目峯巒觀未盡有僧攜紙覔題詩送夏元鼎歸鴈山真西山嗟我深扃五柳門無従相與細論文會須脫履囂塵去鴈蕩山頭或見君元送輔賢出山作二首首尾吟李孝光號五峯著作郎樂清人儒官不畏簡書催拄杖休驚石上苔行到水窮雲起處路從四十九盤来路從四十九盤来樹底看雲首獨回客裏不知身是客向人猶愛話簫臺贈靈岩秀禪師二首北林日午煖如烘盡日溪行曲折中自愛敲水看魚上山頭樹影落溪紅密色都無霜露氣壁間看此一枝筇平霞室裏論文酒未信闍黎飯後鍾雪屋為通上人之第作倒挽天河轉翠微玉虬鱗甲滿天飛道人結屋東邊住愛看晴花不掩扉國朝入鴈山朱書卿樂清人雙鸞峯下踏莓苔鳥道斜經五老臺長嘯一聲風滿壑半天羅漢洞門開逰鴈山鄭善夫郎中福建人號少谷昔年梦上百尋臺薄海鯨波天地囘四十九盤東向立鴈山猶是夣中来龍湫和韻朱濂樂清人竹下烟浮僧煑茶草邊風軟是韶華芒鞋無數看山客𤄗布巖前數落花寄題鴈山書院夏言號桂洲少師兼太子太師江西貴溪人聞君書院鴈山中却在西岩弟幾峯何日青鞵訪靈谷白頭端拜蕩南翁和尚巖裵紳號右山御史山西人一僧兀坐似安禪日炙風吹不計年錫化空山應有待乗龍還許到西天石梁石梁突起半山空冷冷鳴泉瀉洞中古木煙深藏虎穴靈潭無底長跤龍玉女峯玉顏何必要濃粧獨立青霄出洞房不效巫山神女夢為雲為雨媚襄王鴈山四絕廖希顏號東雩叅政湖廣人千尋瀑布瀉芙蓉一派銀河走玉龍疑是天孫裁素練面前遺下剪刀峯翦刀峯高千仞巍剪下天孫雲錦機不見嵓前瀑布縷至今搖颺如絲飛靈峯無主野蒿開藤老雲深半古苔只有雙鸞不飛去月明僊子洞蕭来猿聲鳥語道邊聞水色嵐光樹杪分秌盡長空飛白鵠天風吹散石梁雲梅雨岩王獻芝號湛臺御史徽州人寒谷銀河瀉九天瀟瀟細雨弄厓前海風狂激晴嵐滿洗出含珠對月圓僊人橋吳綸尚書諡恭毅樂清人兩厓排闥倚天高上駕橫空一玉橋為有廣寒宮裡客徃来經過在雲霄展旗峰天造旌旄出地間萬年樹立鎮山關無心雲霧間舒卷有影龍蛇自往還登龍湫背王健號鶴泉少卿永嘉人萬仞危峰半倚天白雲簇擁紫金蓮順風直上龍湫背疑是乘龍到日邊龍湫二絕萬疊盤桓尋雁宕千尋飛洒對龍湫雷霆地激澄潭起河漢天廽絕壁流拔地萬重青嶂立懸空千丈素流分共看玉女機絲挂暎日還成五色文次鶴泉上龍湫背朱守宣號靈谷知州樂清人使節扶摇自九天錦衣照耀鴈池蓮山人不預龍門約望見星槎犯斗邊龍湫李頌樂清人玉龍千尺噴靈湫萬丈銀河瀉碧流乘興縈廻躋絕頂恍疑有路接瀛州天柱峯矦一元寥寥萬仞卓雲空黃道低分彩翠中恠得地維長不缺千山雄壓海門東玉女峯行雲飛盡鴈湖巔玉女明粧尚儼然自是天皇巷衣伴錯教人賦洛神篇龍鼻水林大春號石洲提學潮陽人絕磴懸崖隱萬峯長空昨夜起蛟龍真形化作靈岩石噓氣猶成玉露濃靈峯洞仙子何年闢洞天手持雙斧下蒼煙簷前時許金莖滴為種華山玉井蓮僧抱石何鏜號濱岩叅政處州人面壁嘗攀少室龕鄉山重見倚江潭如何要解西来意拆韋南游更再三余往游嵩山少室上達摩洞見立石向壁儼然一僧也余鄉括蒼山有石僧立江于今又見此石豈處處示人習靜耶龍鼻水趙性魯號疊巖大理寺副樂清人顆顆勻圎走玉盂卧龍鼻觀瀉明珠會看白日拏雲去一洒甘霖四海蘇大龍湫王叔果號西華憲副永嘉人澗道秋生松檜風水花飛堕綠雲中未論天外招黃鵠且向尊前看白虹又懸崖飛瀑信竒哉夭矯乗風萬状迴疑是天孫張疋練剪刀側立若為裁靈峯洞古洞穹窿逈絕塵竒峯環列翠嶙峋朱欄窈窕憑雲架漫向名山結勝因又縹緲連峯望不分崆峒誰鑿掩觧雲不聞海上歸黃鶴試向厓端辨赤文靈巖寺上谷何年建化城諸峯羅立似相迎老猿引子窺人過好鳥呼朋隔樹鳴又排雲玉筍聳遙岑獻秀爭竒總會心安得昔人驅石法稍移一二鎮園林登龍湫背李勑樂清人盤紆鳥道上青天萬朶真疑太華蓮自笑野人狂太甚春風三宿白雲邊龍湫林大春千年幽勝擅南陬萬里常雲枕碧流氣動若為丹鳳舞秋深坐使白猿愁石梁洞石梁飛渡自天台誰復移之此地来久渾如枯樹色天寒忽見野梅開觀大龍湫漫興黃猷吉號両皋山隂人百年幾度雁山逰我為胸中萬斛愁天上斗槎真可握等閒酌盡大龍湫出鴈蕩山見海上舟行口占十日山行不見舟出山晴海望如秋片帆搖曵来何處好是逢仙返十洲天柱峯張國紀安吉人萬丈孤高天柱峯仙人曾此架長虹不周未必傾西北只為秦王到海東五日雨游鴈宕觧疑山靈兼柬龍塘憲使五首簫廩號隅侍郎江西萬安人生平守朴更棲玄擬向名山早結縁嘉節屡虛三過後余廿年游宦過家僅三遇立節勝游還咲十年前甲戌曾逰此山過老僧岩遇雨而止塵容俗状君應憎獻巧廻竒我亦憐賴有雨雲時擁護不妨賓主兩無嫌曾駕蒼虬百二間華吴真對斗雲閒朅來海上春波靜喜見山中藥草殷一雨豈堪囬俗駕雙旌先已度靈関游人莫嘆衝泥險且為三農一觧顏渭曲相逢眼倍眀十年還共海山行千峰過雨旌旗净萬壑流泉皷角鳴鴈度嶺雲開洞府龍飛岩瀑接滄瀛縱言佳景堪留客俯仰乾坤別有情五言律宋重逰鴈山呂夷簡徃年逰海嶠上徹最高層雲外疑無路山中忽見僧虎蹲臨澗石猿掛半巖藤何日拋龜紐孤峯上再登大龍湫趙師秀一派落寒空如何畵得同高風吹作雨低日射成虹西域書曾說先朝路始通或言龍已老出處別為宮鴈山寶冠寺行向石闌立清寒不可云流来橋下水疑是洞中雲欲住逢年盡因吟過夜分蕩隂當絕頂一鴈未曾聞方虛谷曰杜荀鶴秪應松上鶴便是洞中人此三四亦相犯五六有味逰鴈蕩康惇不怕石頭滑来為鴈蕩行平生夣不到今日眼逾明未𠪱千峯秀先逢一𫨻清遍觀從此始着脚履崢嶸石門菴即今石門寺翁靈舒山到極深處石門為地名嵐蒸空寺壞雪壓小菴清果落羣𤠔拾林昏獨虎行一僧何所得高坐若無情壽昌道中清逰従此始過處必須看背日山梅瘦随潮海鴨寒平途迷望闊峻嶺疾行難聽得居人說今年冬又殘按壽昌詩本非鴈山作以方虛谷逰鴈山選此二詩故附于此龍湫觀瀑晁端彦萬丈龍湫水飛流翠壁開始疑河漢落翻若海潮来飄灑四時雪喧聞萬壑雷廬山吾未到氣象勝天台靈岩靈峯戴復古號石屏黃岩人駭見二靈境山林體勢豪插空天柱壯障日石屏高覽勝苦不足登危可憚勞白雲飛動處絕壁走猿猱淨明林巒相掩暎嵓谷獨玲瓏下置維摩室上通龍伯宮靈珠四時雨秋水一簾風甚欲觀新月山高脚力窮鴈山左緯號委羽黃岩人亂山無限好幽有時迷石骨秋偏瘦松稍老却低天寒聞鴈過月白見烏栖海上知名地無人識馬蹄龍湫郭君舉絕頂龍君宅深疑與海連飛来千丈瀑下潤幾桑田噀日虹霓壮随風雪霰圓高寒吟未穩欲去復廻旋觀音岩上得馬鞍嶺竒峯應接頻遙看孤絕處分現普陀身納月瓶泉冷嬌春柳黛新却疑吳道子貌出此岩真天聰洞混沌何年鑿天聰亦强名我疑龍窟宅人說鬼經營梯向岩邊架雲従洞裏生此行頑徤甚脚力十分輕維摩室来問維摩疾因叅不二門一龕閒日月方丈別乾坤風落巖花煖雨晴山鳥喧何當分半席默坐聽潺湲巖居僧趙師秀開扉坐石層盡日少人登一鳥過寒木數花搖翠藤茗煎氷下水香炷佛前燈我亦逃名者何因似此僧元代送彥明李五峯詩舸幾時發秋風海水腥雲分鴈蕩路江繞蛣䗁亭大府文星聚名山僧氣靈憑君道問訊無恙讀書螢能仁方丈朱希晦號雲松樂清人山中松桂老濃翠鬱紛紛水壯蛟龍氣風高鴻鴈羣浮嵐晴後見疎罄夜深聞却憶龐居士衰年屏俗氛淨名寺纔入清涼境憑高意豁然山橫烟簇簇溜滴雨㳙㳙靜坐維摩室因叅達磨禪奏名人已逺遺像閱千年國朝宿靈峯寺黃璨中書永嘉人尋幽来此地四顧冷扵秋愛靜經三宿偷閒約再逰僧今無白足佛古尚青頭歸路鐘聲外遙登十里舟大龍湫鄭少谷𤄗布飛不徹大聲空谷哀青天下河漢白日奔風雷潭穩蛟龍定鴻鴈来方岩倚天畔吾志在崔嵬宿能仁王獻芝空山飛野火千朶照芙蓉宕氣分禪榻湫雲鎻寺峯夢驚靈運草心憶了公松落葉飛泉石翻疑雨意濃龍鼻嵓裵紳真境中天迥烟封古洞深石龍懸潄玉風磵坐鳴琴盛有青雲氣寧忌霖雨心願將一滴水直擬滌凢襟鴈山次韻王伏主事福建人萍蹤多舊友登覽此時懷勝槩千年在浮生幾度来飛泉懸石瀉翠壁拂雲開不盡登山興新詩取次裁能仁孔天胤號文谷提斈山西人夕陽下山坂旅宿山門禪窻暝乘嵓樹庭昏帶雨烟力疲甘宴處氣熱喜涼泉時有玄猿嘯空帷復不眠過丹芳嶺吳綸每過丹芳嶺蜿蜒七七蟠身登三島外足躡五雲端素練懸厓𤄗瓊珠潄石湍入林暑氣薄秋滿萬山寒再過丹芳嶺千古丹芳嶺逰人去又来霜楓紅似錦春樹綠扵苔幽鳥逢人語寒花待日開風光還復舊正遇一陽回靈